---
# Same checks CI runs, before the commit exists.
#   uv tool install pre-commit && pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      # Catches a private key committed by accident. Cheap insurance on a
      # repo whose whole subject is SSH between machines.
      - id: detect-private-key

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint

  - repo: https://github.com/ansible/ansible-lint
    rev: v25.6.1
    hooks:
      - id: ansible-lint

  # Must match the shellcheck-py pin in .github/workflows/ci.yml and the
  # version on the boxes. SC2015 fires on some versions and not others, so a
  # split here is a file that passes `make check`, passes the hook, and turns
  # CI red - with nothing in the diff to explain it.
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck
