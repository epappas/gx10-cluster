---
# Things that are ready but NOT installed by site.yml.
#
# torchrun already runs a 2-node job across both boxes, so none of these is
# needed to use the cluster. They are here, ready, for when the need appears:
#
#   ray         a cluster that outlives a single job, and the substrate
#               multi-node vLLM uses for tensor parallelism.
#   slurm       real queueing, fair-share and accounting. Heavy for two nodes.
#   exporters   node_exporter + GPU metrics, ~20 MB RSS, for an EXTERNAL
#               prometheus to scrape.
#   dashboards  the above plus prometheus and grafana on this box. Costs real
#               memory, which here is model capacity - prefer running them
#               elsewhere and pointing at the exporter.
#   node        Node.js via nvm. Nothing in the ML path needs it; it is here
#               for JS tooling if you happen to want it.
#
#   ansible-playbook optional.yml --tags ray -K
#   ansible-playbook optional.yml --tags exporters -K
#
# Nothing runs without a tag, so an accidental invocation is a no-op.
#
# ---------------------------------------------------------------------------
# These are TASKS with include_role, not a `roles:` list, and that is the whole
# point. Tags on a `roles:` entry are applied to every task inside the role,
# and task-level tags are ADDITIVE, not restrictive - so the previous
# `- { role: observability, tags: [exporters, dashboards, never] }` gave every
# task in that role all three tags, and `--tags exporters` installed prometheus
# and grafana too. Exactly what the role's own header promised it would not do.
#
# A dynamic include_role propagates only the tags on the include itself, so the
# split is real.
#
# `apply:` IS LOAD-BEARING. That same propagation rule is why: the tags below
# select the include, and the role's own tasks carry no tag at all - so under
# `--tags ray` the include ran, matched, and then every task inside it was
# filtered out. `make optional TAGS=ray` included the role, executed nothing,
# and reported ok=1 changed=0. A silent no-op that looks exactly like success,
# on every one of these entries. `apply: tags:` is the documented mechanism
# that pushes the tag down onto the included tasks.
#
# Each `apply` lists ONLY the tag that selects it, so the exporters/dashboards
# split above is preserved - `--tags exporters` still cannot pull in grafana.
#
# `--list-tasks --tags exporters` does NOT prove any of this and was the reason
# the bug survived: it does not expand dynamic includes, so it prints the
# include task and stops, looking identical whether the role runs or not. The
# only proof is a run that reports a non-zero task count.
# ---------------------------------------------------------------------------

- name: Install optional components
  hosts: gx10
  serial: 1
  any_errors_fatal: true

  # The `never` tag means a bare `ansible-playbook optional.yml` does nothing
  # at all. You have to ask for one by name.
  tasks:
    - name: Ray cluster
      ansible.builtin.include_role:
        name: ray
        apply:
          tags: [ray]
      tags: [ray, never]

    - name: Slurm queueing
      ansible.builtin.include_role:
        name: slurm
        apply:
          tags: [slurm]
      tags: [slurm, never]

    - name: Metrics exporters (the cheap half)
      ansible.builtin.include_role:
        name: observability
        tasks_from: exporters
        apply:
          tags: [exporters]
      tags: [exporters, never]

    # dashboards.yml pulls in exporters.yml itself - there is nothing to scrape
    # without it.
    - name: Prometheus and Grafana (the expensive half)
      ansible.builtin.include_role:
        name: observability
        tasks_from: dashboards
        apply:
          tags: [dashboards]
      tags: [dashboards, never]

    - name: Node.js toolchain
      ansible.builtin.include_role:
        name: dev_node
        apply:
          tags: [node]
      tags: [node, never]

    # Installs the tooling only. `make bench` runs it.
    - name: Benchmark tooling
      ansible.builtin.include_role:
        name: benchmark
        apply:
          tags: [bench]
      tags: [bench, never]
