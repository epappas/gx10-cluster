[defaults]
inventory            = inventory.yml
roles_path           = roles

# The vault password, so nothing has to pass --ask-vault-pass. Gitignored, and
# so is every vault.yml it opens.
#
# This is not only about convenience. `make render` renders slurm.conf.j2,
# which reads hostvars for the gx10 group - and that forces ansible to decrypt
# group_vars/gx10/vault.yml. Without a password the whole test suite fails with
# "Attempting to decrypt but no vault secrets found" on any machine that has a
# vault, which is exactly the machine the token was set up on.
#
# A MISSING .vault_pass is a hard error on every ansible command, not a
# fallback to prompting - so if you clone this repo without one, either create
# it or comment this line out.
vault_password_file  = .vault_pass
retry_files_enabled  = False
interpreter_python   = /usr/bin/python3
forks                = 10
nocows               = 1

# NOT `stdout_callback = yaml` - that was community.general.yaml, removed in
# community.general 12.0.0. Setting it aborts every run with "callback plugin
# has been removed" while --syntax-check still passes, because syntax-check
# does not load stdout callbacks. Same output, core-native, no collection:
stdout_callback  = default
result_format    = yaml
callbacks_enabled = ansible.posix.profile_tasks

# We push authorized keys and run privileged tasks over these connections, so
# authenticate the host rather than blindly trusting it. accept-new pins on
# first contact instead of prompting, which keeps unattended runs working.
host_key_checking = True

[privilege_escalation]
become_method = sudo

[ssh_connection]
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=300s -o StrictHostKeyChecking=accept-new
