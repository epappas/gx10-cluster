[defaults]
inventory            = inventory.yml
roles_path           = roles
retry_files_enabled  = False
interpreter_python   = /usr/bin/python3
forks                = 10
nocows               = 1

# NOT `stdout_callback = yaml` - that was community.general.yaml, removed in
# community.general 12.0.0. Setting it aborts every run with "callback plugin
# has been removed" while --syntax-check still passes, because syntax-check
# does not load stdout callbacks. Same output, core-native, no collection:
stdout_callback  = default
result_format    = yaml
callbacks_enabled = ansible.posix.profile_tasks

# We push authorized keys and run privileged tasks over these connections, so
# authenticate the host rather than blindly trusting it. accept-new pins on
# first contact instead of prompting, which keeps unattended runs working.
host_key_checking = True

[privilege_escalation]
become_method = sudo

[ssh_connection]
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=300s -o StrictHostKeyChecking=accept-new
