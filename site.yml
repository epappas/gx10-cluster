---
- name: Provision GX10 node
  hosts: gx10
  gather_facts: true

  pre_tasks:
    - name: Assert this is an aarch64 GX10-class machine
      ansible.builtin.assert:
        that:
          - ansible_architecture == "aarch64"
          - ansible_distribution == "Ubuntu"
        fail_msg: >-
          This playbook targets aarch64 Ubuntu (DGX OS on GX10).
          Found {{ ansible_architecture }} / {{ ansible_distribution }}.
        success_msg: "{{ ansible_hostname }}: aarch64 Ubuntu {{ ansible_distribution_version }}"

    - name: Report GPU
      ansible.builtin.command: nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv,noheader
      register: gpu_info
      changed_when: false
      failed_when: false

    - name: Show GPU
      ansible.builtin.debug:
        msg: "GPU: {{ gpu_info.stdout | default('nvidia-smi unavailable') }}"

  roles:
    - { role: base,       tags: [base],    when: enable_base    | bool }
    - { role: docker,     tags: [docker],  when: enable_docker  | bool }
    - { role: shell,      tags: [shell],   when: enable_shell   | bool }
    - { role: dev_python, tags: [python],  when: enable_python  | bool }
    - { role: dev_rust,   tags: [rust],    when: enable_rust    | bool }
    - { role: dev_node,   tags: [node],    when: enable_node    | bool }
    - { role: ml,         tags: [ml],      when: enable_ml      | bool }
    - { role: remote,     tags: [remote],  when: enable_remote  | bool }
    - { role: cluster,    tags: [cluster], when: enable_cluster | bool }
