---
- name: Provision GX10 node
  hosts: gx10

  # One node at a time, and stop the moment one fails. The whole point of
  # owning a second GX10 is having a known-good machine to recover from;
  # applying an untested change to both at once throws that away.
  serial: 1
  any_errors_fatal: true

  pre_tasks:
    - name: Assert this is an aarch64 GX10-class machine
      ansible.builtin.assert:
        that:
          - ansible_architecture == "aarch64"
          - ansible_distribution == "Ubuntu"
        fail_msg: >-
          This playbook targets aarch64 Ubuntu (DGX OS on GX10).
          Found {{ ansible_architecture }} / {{ ansible_distribution }}.

    - name: Read GPU identity
      ansible.builtin.command: nvidia-smi --query-gpu=name,driver_version,compute_cap --format=csv,noheader
      register: gpu_info
      changed_when: false
      # --check skips command modules by default, which would leave gpu_info
      # empty and make the assert below fail with a misleading "wrong GPU"
      # during `make diff`. This task only reads.
      check_mode: false

    - name: Assert the GPU is the expected compute capability
      ansible.builtin.assert:
        that: (gpu_info.stdout.split(', ') | last | trim) == gpu_arch_list
        fail_msg: >-
          Expected compute capability {{ gpu_arch_list }} (GB10 / sm_121) but
          found {{ gpu_info.stdout }}. The PyTorch index and llama.cpp CUDA
          architecture in this repo are chosen for sm_121 and would produce a
          silently broken install on a different GPU.
        success_msg: "{{ gpu_info.stdout }}"

  roles:
    - { role: base,       tags: [base] }
    - { role: docker,     tags: [docker] }
    - { role: shell,      tags: [shell] }
    - { role: dev_python, tags: [python, dev] }
    - { role: dev_rust,   tags: [rust, dev] }
    - { role: dev_node,   tags: [node, dev] }
    - { role: ml,         tags: [ml] }
    - { role: remote,     tags: [remote] }
    - { role: cluster,    tags: [cluster] }

# Deliberately a second play with NO `serial:`. The play above completes host A
# entirely before host B starts, so during A's run B has not generated its
# inter-node key yet and cross-authorization would silently do nothing. A new
# play begins only once every host has finished the previous one, which is the
# first moment both keys exist.
- name: Establish inter-node trust
  hosts: gx10
  gather_facts: false
  any_errors_fatal: true
  tags: [cluster]
  tasks:
    - name: Cross-authorize the cluster SSH keys
      ansible.builtin.include_role:
        name: cluster
        tasks_from: trust
