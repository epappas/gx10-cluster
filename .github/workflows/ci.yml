---
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# CI runs only the checks that do not need the hardware. The GB10, the CUDA
# driver and the ConnectX-7 cannot be faked in a container, so anything that
# touches them is a `make` target you run on the box - see docs/contributing.md.
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ansible and linters
        run: |
          pipx install --include-deps ansible-core
          pipx inject ansible-core ansible
          pipx install ansible-lint
          pipx install yamllint

      - name: yamllint
        run: yamllint .

      # Exactly what `make check` runs locally - lint, syntax, smoke, render -
      # so "CI is green" and "make check passes" cannot drift apart.
      - name: make check
        run: make check

      - name: shellcheck
        run: shellcheck bootstrap.sh
