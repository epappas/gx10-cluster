---
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# CI runs only the checks that do not need the hardware. The GB10, the CUDA
# driver and the ConnectX-7 cannot be faked in a container, so anything that
# touches them is a `make` target you run on the box - see docs/contributing.md.
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ansible and linters
        run: |
          pipx install --include-deps ansible-core
          pipx inject ansible-core ansible
          # Pinned to the pre-commit hook's version so a new ansible-lint
          # major cannot turn CI red with zero repo changes.
          pipx install 'ansible-lint==25.6.1'
          pipx install yamllint
          # tests/check_handlers.py parses YAML with the plain interpreter,
          # and setup-python provides a bare one. pipx venvs are isolated, so
          # ansible-core's own PyYAML is not importable from here.
          python -m pip install --quiet pyyaml

      # ansible-lint runs in its own isolated venv with ansible-core and NO
      # collections, so every non-builtin module errors as unknown. It
      # auto-installs whatever requirements.yml declares.
      - name: Install pinned collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: yamllint
        run: yamllint .

      # Exactly what `make check` runs locally - lint, syntax, smoke, render -
      # so "CI is green" and "make check passes" cannot drift apart.
      - name: make check
        run: make check

      - name: shellcheck
        run: shellcheck bootstrap.sh
