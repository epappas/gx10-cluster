---
# Checks run by verify.yml. Each carries a hint naming the runbook that fixes
# it, so a failure tells you what to do rather than only what broke.
#
# required: false  -> reported but does not fail the run (things that depend
#                     on a cable being connected, or on an optional role).

verify_checks:
  - name: "GPU"
    cmd: "nvidia-smi --query-gpu=compute_cap --format=csv,noheader | grep -qx '{{ gpu_arch_list }}'"
    hint: "GPU is not reporting sm_{{ gpu_arch_list }}. See docs/runbooks/troubleshoot.md"

  - name: "CUDA toolkit"
    cmd: "nvcc --version | grep -q 'release {{ cuda_major }}'"
    hint: "nvcc is missing or not CUDA {{ cuda_major }}. See docs/runbooks/upgrade-drivers.md"

  - name: "driver held"
    cmd: "apt-mark showhold | grep -q nvidia-modprobe"
    hint: "The driver stack is not held; apt could skew it. Re-run: make apply TAGS=base"

  - name: "docker without sudo"
    cmd: "docker info > /dev/null 2>&1"
    hint: "Not in the docker group, or you have not logged out and back in since provisioning."

  - name: "docker nvidia runtime"
    cmd: "docker info --format '{{ '{{' }}.DefaultRuntime{{ '}}' }}' | grep -q nvidia"
    hint: "NVIDIA runtime is not the docker default. Re-run: make apply TAGS=docker"

  - name: "NCCL installed"
    cmd: "dpkg -s libnccl2 > /dev/null 2>&1"
    hint: "NCCL missing. Re-run: make apply TAGS=ml"

  - name: "torch sees GB10"
    cmd: >-
      {{ ml_venv }}/bin/python -c "import torch, sys;
      cc = torch.cuda.get_device_capability(0);
      sys.exit(0 if f'{cc[0]}.{cc[1]}' == '{{ gpu_arch_list }}' else 1)"
    hint: "torch cannot see an sm_{{ gpu_arch_list }} GPU. See docs/runbooks/troubleshoot.md"

  - name: "torch kernel launch"
    cmd: >-
      {{ ml_venv }}/bin/python -c "import torch;
      x = torch.randn(2048, 2048, device='cuda'); (x @ x).sum().item()"
    hint: "torch imports but cannot run a kernel - usually the wrong wheel index. See docs/runbooks/troubleshoot.md"

  - name: "sshd listening"
    cmd: "systemctl is-active --quiet ssh.socket"
    hint: "ssh.socket is not active. See docs/runbooks/recover-ssh-lockout.md"

  - name: "sshd config valid"
    cmd: "/usr/sbin/sshd -t"
    hint: "Merged sshd config is invalid - fix before rebooting. See docs/runbooks/recover-ssh-lockout.md"

  - name: "swappiness"
    cmd: "[ \"$(sysctl -n vm.swappiness)\" = '1' ]"
    hint: "Swappiness is not 1; a large job can hit the swap cliff. Re-run: make apply TAGS=base"

  - name: "shell env"
    cmd: "grep -q PYTORCH_CUDA_ALLOC_CONF $HOME/.gx10env.sh"
    hint: "Shell environment not installed. Re-run: make apply TAGS=shell"

  # --- cable-dependent: reported, never fatal ------------------------------
  - name: "RDMA devices"
    cmd: "ibv_devices 2>/dev/null | tail -n +3 | grep -q ."
    required: false
    hint: "No RDMA devices - expected until a QSFP cable links the two boxes. See docs/runbooks/connect-cluster.md"

  - name: "interconnect addressed"
    cmd: "ip -br addr show | grep -qE '{{ cluster_subnets | join('|') | replace('.', '\\.') }}'"
    required: false
    hint: "Interconnect not addressed - expected until cabled. See docs/runbooks/connect-cluster.md"

  - name: "both interconnect partitions"
    cmd: >-
      [ "$(ip -br addr show | grep -cE '{{ cluster_subnets | join('|') | replace('.', '\\.') }}')" -ge 2 ]
    required: false
    hint: "Fewer than two partitions addressed - you are capped at half the 200 Gb/s. See docs/runbooks/connect-cluster.md"
