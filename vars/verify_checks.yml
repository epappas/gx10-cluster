---
# Checks run by verify.yml. Each carries a hint naming the runbook that fixes
# it, so a failure tells you what to do rather than only what broke.
#
# required: false  -> reported but does not fail the run (things that depend
#                     on a cable being connected, or on an optional role).

verify_checks:
  - name: "GPU"
    cmd: "nvidia-smi --query-gpu=compute_cap --format=csv,noheader | grep -qx '{{ gpu_arch_list }}'"
    hint: "GPU is not reporting sm_{{ gpu_arch_list }}. See docs/runbooks/troubleshoot.md"

    # Absolute path: nvcc reaches PATH via /etc/profile.d/nv_paths.sh, which
    # only login shells read. Ansible's shell module is non-login, so a bare
    # `nvcc` passes locally and fails over SSH.
  - name: "CUDA toolkit"
    cmd: "{{ cuda_home }}/bin/nvcc --version | grep -q 'release {{ cuda_major }}'"
    hint: "nvcc is missing or not CUDA {{ cuda_major }}. See docs/runbooks/upgrade-drivers.md"

    # Every entry in driver_stack_holds that is INSTALLED must be held, and the
    # check prints the ones that are not. The previous version counted
    # `apt-mark showhold | wc -l`, which counts holds on ANY package: seven
    # unrelated holds passed it with the driver stack wide open, and its `- 1`
    # fudge fitted this box only because exactly one entry (nvidia-dkms-580)
    # happens to be absent here.
    #
    # "installed" is the real qualifier, not a hedge: dpkg cannot select a
    # package it never installed, so roles/base does not hold those either.
  - name: "driver held"
    cmd: "dpkg-query -W -f='${db:Status-Status} ${db:Status-Want} ${binary:Package}\\n'
      {{ driver_stack_holds | join(' ') }} 2>/dev/null
      | awk '$1 == \"installed\" && $2 != \"hold\" { print $3; unheld = 1 } END { exit unheld }'"
    hint: "The packages listed are installed but not held; apt could skew them. Re-run: make apply TAGS=base"

    # Not required: passes only after a NEW login session picks up the docker
    # group, so it legitimately fails on the first verify after provisioning.
  - name: "docker without sudo"
    cmd: "docker info > /dev/null 2>&1"
    required: false
    hint: "Log out and back in (or `newgrp docker`) to pick up the docker group, then re-run."

  - name: "docker nvidia runtime"
    cmd: "sudo -n docker info --format '{{ '{{' }}.DefaultRuntime{{ '}}' }}' | grep -q nvidia"
    required: false
    hint: "NVIDIA runtime is not the docker default (or sudo needs a password here). Re-run: make apply TAGS=docker"

  - name: "NCCL installed"
    cmd: "dpkg -s libnccl2 > /dev/null 2>&1"
    hint: "NCCL missing. Re-run: make apply TAGS=ml"

    # The lockfile's whole claim is that two boxes provisioned months apart come
    # up identical, and nothing else here would notice it going unapplied: a
    # venv left at last quarter's resolution, or bumped by hand with `uv pip
    # install -U`, still imports, still sees the GPU and still runs a kernel.
    #
    # Compared against the copy roles/ml leaves IN the venv, not against
    # torch_version: that tests the artifact that was applied rather than
    # restating a constant from group_vars. The pin carries the local version
    # (torch==2.13.0+cu130), so the exact-line match also catches a wheel that
    # came from PyPI instead of the cu130 index. Missing torch leaves "torch==",
    # a missing lockfile makes grep exit 2; both fail.
  - name: "lockfile applied"
    cmd: "grep -qxF \"torch==$({{ ml_venv }}/bin/python -c 'import torch; print(torch.__version__)')\"
      {{ ml_venv }}/requirements-ml.txt"
    hint: "The venv does not match its lockfile. Re-run: make apply TAGS=ml. See docs/runbooks/troubleshoot.md"

  - name: "torch sees GB10"
    cmd: >-
      {{ ml_venv }}/bin/python -c "import torch, sys;
      cc = torch.cuda.get_device_capability(0);
      sys.exit(0 if f'{cc[0]}.{cc[1]}' == '{{ gpu_arch_list }}' else 1)"
    hint: "torch cannot see an sm_{{ gpu_arch_list }} GPU. See docs/runbooks/troubleshoot.md"

  - name: "torch kernel launch"
    cmd: >-
      {{ ml_venv }}/bin/python -c "import torch;
      x = torch.randn(2048, 2048, device='cuda'); (x @ x).sum().item()"
    hint: "torch imports but cannot run a kernel - usually the wrong wheel index. See docs/runbooks/troubleshoot.md"

  - name: "sshd listening"
    cmd: "systemctl is-active --quiet ssh.socket"
    hint: "ssh.socket is not active. See docs/runbooks/recover-ssh-lockout.md"

    # sshd -t needs to read the host keys, so it requires root. verify.yml
    # runs unprivileged by design; use sudo -n so the check degrades to a
    # reported failure rather than hanging on a password prompt.
  - name: "sshd config valid"
    cmd: "sudo -n /usr/sbin/sshd -t"
    required: false
    hint: "Run `sudo sshd -t` by hand. If it errors, fix before rebooting - see docs/runbooks/recover-ssh-lockout.md"

    # The out-of-LAN path. Not required: it needs a Nord Account token, which
    # a perfectly healthy LAN-only node does not have.
    #
    # An address on the interface, not `nordvpn` CLI output: the CLI exits 0
    # even when the daemon socket is missing, so its status text is not a
    # reliable signal. roles/remote reports Meshnet as up on exactly this basis.
  - name: "mesh vpn"
    cmd: "[ -n \"$(ip -4 -br addr show {{ nordvpn_iface }} 2>/dev/null | awk '{print $3}')\" ]"
    required: false
    hint: "No {{ nordvpn_iface }} address - Meshnet is off, so this node is LAN-only. See docs/runbooks/recover-ssh-lockout.md"

    # earlyoom kills the largest RSS process when memory gets tight. On a
    # unified-memory box the largest process is ALWAYS the model server, and
    # "tight" is the normal operating point of a 75 GB model - so earlyoom
    # reliably kills exactly the workload this cluster exists to run, under
    # deep-context load, with no error from the server itself.
    #
    # Reported independently by MiaAI-Lab as the first gotcha of running vLLM
    # across two DGX Sparks (docs/decisions.md#two-node-vllm). Not installed by
    # this repo and currently inactive on both nodes; this check exists so a
    # distro update cannot turn it on silently.
  - name: "earlyoom not active"
    cmd: "! systemctl is-active --quiet earlyoom"
    hint: "earlyoom is running and will kill the model server under load: sudo systemctl disable --now earlyoom"

  - name: "swappiness"
    cmd: "[ \"$(sysctl -n vm.swappiness)\" = '1' ]"
    hint: "Swappiness is not 1; a large job can hit the swap cliff. Re-run: make apply TAGS=base"

  - name: "shell env"
    cmd: "grep -q PYTORCH_CUDA_ALLOC_CONF $HOME/.gx10env.sh"
    hint: "Shell environment not installed. Re-run: make apply TAGS=shell"

    # Required even though nothing on ONE node needs it: munge (Slurm) rejects
    # credentials once the clocks differ, with errors that never mention time,
    # and correlating two nodes' logs after a failed run needs it too.
  - name: "clock synced"
    cmd: "[ \"$(timedatectl show -p NTPSynchronized --value)\" = 'yes' ]"
    hint: "Clock not NTP-synced - run `sudo timedatectl set-ntp true`. See docs/runbooks/run-distributed.md"

    # torchrun and mpirun launch their remote workers over SSH, so this is a
    # prerequisite for any distributed run, not a convenience. Deliberately by
    # HOSTNAME - the same name the launchers are given - which resolves to the
    # peer's MANAGEMENT address, not the interconnect. That is why this check
    # is NOT in the cable-dependent block below: it exercises a path that is up
    # whether or not the QSFP cable is seated.
    #
    # Not required all the same: the peer is allowed to be switched off, and a
    # single-node run of `make verify` should not fail for that. Peers come
    # from the inventory rather than the play, so --limit cannot quietly turn
    # this into a no-op.
  - name: "inter-node ssh"
    cmd: "for h in {{ groups['gx10'] | difference([inventory_hostname]) | join(' ') }};
      do ssh -o BatchMode=yes -o ConnectTimeout=5 \"$h\" true
      || { echo \"$h is not reachable\"; exit 1; }; done"
    required: false
    hint: >-
      No key-auth SSH to the peer - torchrun cannot launch there. Run the FULL
      play (no --limit) so both nodes exchange keys.
      See docs/runbooks/run-distributed.md

  # --- cable-dependent: reported, never fatal ------------------------------
  #
  # The fabric is RoCE v2 over an ETHERNET link layer, not InfiniBand. There is
  # no subnet manager and no LID, so ibhosts / ibnodes / iblinkinfo /
  # ibnetdiscover all fail with "can't open UMAD port" on a completely healthy
  # cluster - they are worthless as checks here, and reading their failure as a
  # verdict is the mistake this block is written to prevent. Ask sysfs and
  # ibv_* instead, or run gx10-interconnect for the whole picture.

    # Port STATE, not device presence. The old check was
    # `ibv_devices | tail -n +3 | grep -q .`, which only proved the driver had
    # enumerated something: all four ports could be DOWN with no cable in the
    # box and it still reported green, because the CX-7 enumerates its ports
    # whether or not any of them link. "A device exists" and "a link is up" are
    # different questions and only the second one matters.
  - name: "RDMA link active"
    cmd: "grep -qxs '4: ACTIVE' /sys/class/infiniband/*/ports/1/state"
    required: false
    hint: "No RDMA port is ACTIVE - expected until a QSFP cable links the two boxes. See docs/runbooks/connect-cluster.md"

    # Guards an assumption the whole role rests on. roles/cluster addresses
    # these ports as IP subnets and NCCL reaches them as RoCE, both of which
    # require an Ethernet link layer. A card flipped to IB mode - by a firmware
    # tool, or a replacement part shipped configured differently - would leave
    # every other check here passing while nothing could talk.
  - name: "RoCE fabric"
    cmd: "grep -qxs 'Ethernet' /sys/class/infiniband/*/ports/1/link_layer
      && ! grep -qxs 'InfiniBand' /sys/class/infiniband/*/ports/1/link_layer"
    required: false
    hint: "ConnectX ports are not on an Ethernet link layer; the IP addressing here assumes RoCE. See docs/runbooks/connect-cluster.md"

  - name: "interconnect addressed"
    cmd: "ip -br addr show | grep -qE '{{ cluster_subnets | join('|') | replace('.', '\\.') }}'"
    required: false
    hint: "Interconnect not addressed - expected until cabled. See docs/runbooks/connect-cluster.md"

    # ONE cabled QSFP port, presented as two PCIe partitions that must each
    # land on their own subnet - otherwise both flows leave by one interface.
    # Verified as one port, not two: enp1s0f0np0 and enP2p1s0f0np0 share
    # phys_port_name=p0 and one phys_switch_id.
  - name: "both interconnect partitions"
    cmd: "[ \"$(ip -br addr show | grep -cE '{{ cluster_subnets | join('|') | replace('.', '\\.') }}')\" -ge 2 ]"
    required: false
    hint: "Fewer than two partitions addressed - you are capped at half the interconnect. See docs/runbooks/connect-cluster.md"


  # --- serving and monitoring ----------------------------------------------
  - name: "vLLM image"
    cmd: "sudo -n docker image inspect {{ vllm_image }} > /dev/null 2>&1"
    required: false
    hint: "vLLM image not pulled. See docs/runbooks/serve-models.md; re-run: make apply TAGS=inference"

  - name: "vllm-serve"
    cmd: "test -x $HOME/.local/bin/vllm-serve"
    hint: "vllm-serve launcher missing. Re-run: make apply TAGS=inference"

  - name: "gx10-status"
    cmd: "test -x $HOME/.local/bin/gx10-status"
    hint: "Status tool missing. Re-run: make apply TAGS=monitoring"

    # In /usr/local/bin rather than ~/.local/bin, so that `ssh <node>
    # gx10-interconnect` works: that is a non-login shell and never gets
    # ~/.local/bin on PATH. Same for gx10-top below, which is invoked over SSH
    # by its own collector fan-out.
  - name: "gx10-interconnect"
    cmd: "test -x /usr/local/bin/gx10-interconnect"
    hint: "Interconnect diagnostic missing. Re-run: make apply TAGS=cluster"

  - name: "gx10-top"
    cmd: "test -x /usr/local/bin/gx10-top"
    hint: "Cluster-wide top missing. Re-run: make apply TAGS=monitoring"

    # Tests the TIMER, not the service. The service is oneshot and is inactive
    # almost all the time by design - it runs for ~0.08 s and exits - so
    # `is-active gx10-sample.service` would report failure on a perfectly
    # healthy node. Not required, because monitoring_history is a real off
    # switch and a node with it off is not broken.
  - name: "history sampler"
    cmd: "systemctl is-active --quiet gx10-sample.timer"
    required: false
    hint: "Nothing is recording history, so a 3am throttle will leave no trace. Re-run: make apply TAGS=monitoring"

    # The metrics stack is opt-in and deliberately absent by default - it costs
    # memory, which on this box is model capacity.
    #
    # The endpoint, not `systemctl is-active`: the unit stays active when the
    # exporter is listening on the wrong address, and the address is the part
    # that moved (0.0.0.0 -> monitoring_bind). Scraping it proves both.
  - name: "metrics exporter"
    cmd: "curl -sf --max-time 3 http://{{ monitoring_bind }}:{{ node_exporter_port }}/metrics | grep -q '^node_'"
    required: false
    hint: "No exporter on {{ monitoring_bind }}:{{ node_exporter_port }} (opt-in). See docs/runbooks/monitoring.md"

    # Counts model repos, not directory entries. "Is the hub directory
    # non-empty" reported this check green on a cache holding one 4-byte
    # CACHEDIR.TAG and no weights at all - huggingface_hub writes that marker
    # the first time anything touches the cache, so the check passed on a box
    # where the models role had never successfully downloaded a thing.
  - name: "models cached"
    cmd: "[ \"$(ls -1d $HOME/.cache/huggingface/hub/models--* 2>/dev/null | wc -l)\" -gt 0 ]"
    required: false
    hint: "No models cached yet. See docs/runbooks/manage-models.md; run: make models"
