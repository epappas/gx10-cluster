---
# GX10 cluster inventory.
#
# To add the second node, add this block under `hosts:` and run the FULL play
# (not --limit) so both nodes exchange interconnect SSH keys in the same run:
#
#     gx10-b:
#       ansible_host: <node-2-lan-address>
#       ansible_user: <your-user>
#       cluster_index: 11
#       cluster_rank: 1
#
# cluster_index is the host octet on BOTH interconnect subnets, matching
# NVIDIA's connect-two-sparks playbook: .10 and .11.
#
# `serial: 1` in site.yml still provisions them one at a time.
# See docs/runbooks/provision-node.md

all:
  children:
    gx10:
      hosts:
        gx10-a:
          ansible_connection: local
          cluster_index: 10
          cluster_rank: 0

      vars:
        # Rendezvous host for torchrun. Node 0's address on the first subnet.
        cluster_master_ip: "{{ cluster_subnets[0] }}.10"
