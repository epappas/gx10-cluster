---
# GX10 cluster inventory.
#
# Node 1 (gx10-a) is this machine, provisioned over the local connection.
# Node 2 (gx10-b) is provisioned over SSH once it is on the network.
#
# To provision node 2:
#   1. Uncomment the gx10-b block below and set ansible_host to its LAN/WiFi IP.
#   2. ssh-copy-id <user>@<ip>   (or let roles/remote push your key)
#   3. ansible-playbook site.yml --limit gx10-b -K

all:
  children:
    gx10:
      hosts:
        gx10-a:
          ansible_connection: local
          ansible_host: 127.0.0.1
          # Address this node takes on the 200G ConnectX-7 link between the boxes.
          cluster_ip: 10.10.10.1
          cluster_rank: 0

        # gx10-b:
        #   ansible_host: 192.168.1.NNN     # <-- LAN address of the second box
        #   ansible_user: epappas
        #   cluster_ip: 10.10.10.2
        #   cluster_rank: 1

      vars:
        # Node 0 is the rendezvous point for torchrun / NCCL.
        cluster_master_ip: 10.10.10.1
        cluster_master_port: 29500
