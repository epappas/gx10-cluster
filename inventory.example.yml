---
# GX10 cluster inventory - EXAMPLE. Copy it and edit:
#
#     cp inventory.example.yml inventory.yml
#
# `inventory.yml` is gitignored, so your hostnames and addresses stay out of the
# repo. bootstrap.sh seeds it for you if it is missing. Nothing reads this file
# directly - ansible.cfg points at inventory.yml.
#
# The addresses below are RFC 5737 documentation addresses (192.0.2.0/24),
# chosen deliberately: they are guaranteed not to route anywhere, so forgetting
# to edit this fails fast with an unreachable host instead of quietly reaching
# some other device on your LAN.
#
# The inventory hostname IS the machine's hostname. `roles/base` sets the
# system hostname from `node_hostname`, which defaults to the inventory name,
# so `odysseus` in this file, `hostname` on the box, the entry in /etc/hosts,
# the `Host` block in ~/.ssh/config, the Slurm NodeName and the Prometheus
# instance label are all one string with one source. Rename a host here and
# everything follows on the next run.
#
# The group stays `gx10` - that names the hardware, not the machines.
#
# BOTH nodes are addressed over SSH, including the one you happen to be sitting
# at. An `ansible_connection: local` entry for the local box looks like a free
# optimisation and is not: it makes the play runnable only FROM that box, the
# same command then behaves differently depending on where you type it, and the
# local host silently skips the SSH path every other host exercises - so the
# path that breaks is the one you never test.
#
# ansible_host is the MANAGEMENT address, and it is load-bearing well beyond
# ssh: roles/base maps it to the node name in /etc/hosts, roles/cluster writes
# it into every peer's ssh config, and roles/remote opens ufw to it so NCCL's
# bootstrap channel (ephemeral ports, no port-scoped rule can express it) is
# not dropped. So it must be the address on the interface the nodes actually
# reach each other over - the one `mgmt_iface` resolves to.
#
# Use the WIRED address, not WiFi. On the reference pair the wired link is the
# default route and therefore what mgmt_iface auto-detects; the WiFi addresses
# were neither, and measured 130 ms against 0.88 ms on a different subnet from
# the interface NCCL would have bootstrapped over.
#
# roles/base pins them, so a DHCP lease cannot move a node's identity out from
# under this file. See mgmt_addr_static in group_vars/all.yml.
#
# cluster_index is the host octet on BOTH interconnect subnets, matching
# NVIDIA's connect-two-sparks playbook: .10 and .11.
#
# cluster_rank names rank 0 - the torchrun master, the Ray head and the Slurm
# controller. Everything derives the controller from THIS field via
# `cluster_controller` in group_vars/all.yml, never from inventory order, so
# reordering this file cannot silently move the controller.
#
# `serial: 1` in site.yml provisions them one at a time.
# See docs/runbooks/provision-node.md

all:
  children:
    gx10:
      hosts:
        odysseus:
          ansible_host: 192.0.2.10   # <- replace
          cluster_index: 10
          cluster_rank: 0

        poseidon:
          ansible_host: 192.0.2.11   # <- replace
          cluster_index: 11
          cluster_rank: 1

      vars:
        # Both boxes run the same account, and it is NOT hardcoded here - see
        # gx10_user in group_vars/all.yml, which defaults to your local
        # username. Set it there, or pass -e gx10_user=... for one run.
        #
        # Until `sudo_passwordless` has been applied once, `become` needs -K -
        # and ansible prompts once per RUN, not once per host, so every node
        # must accept the same sudo password.
        ansible_user: "{{ gx10_user }}"
