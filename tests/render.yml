---
# Render every template against real facts.
#
# Neither ansible-lint nor --syntax-check evaluates a template, so an undefined
# variable or a bad filter surfaces only when Jinja runs - which, without this,
# means the first time you provision a machine.
#
# Runs on localhost, NOT the gx10 inventory group, deliberately:
#   - inventory-independent, so renaming a group or fat-fingering --limit
#     cannot turn this suite into a silent no-op that reports success;
#   - it does not try to SSH to the second node the moment one is added, which
#     would make CI permanently red for a template test that needs no cluster.
#
#   make render

- name: Render all templates
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    out: /tmp/gx10-render
    repo_root: "{{ playbook_dir | dirname }}"

    # Facts the roles set at runtime, plus inventory group vars that are not in
    # scope on localhost, supplied so every conditional branch renders.
    cluster_index: 10
    cluster_rank: 0
    cluster_master_ip: "192.168.100.10"
    cluster_link_present: true
    cluster_ifaces: [enp1s0f1np1, enP2p1s0f1np1]

  tasks:
    - name: Ensure the output directory exists
      ansible.builtin.file:
        path: "{{ out }}"
        state: directory
        mode: "0700"

    # Discovered, not hand-listed: a new template is covered automatically.
    # (fileglob cannot glob directory components; find can.)
    - name: Discover every template in the repo
      ansible.builtin.find:
        paths: "{{ repo_root }}/roles"
        patterns: "*.j2"
        recurse: true
      register: templates

    - name: Fail if no templates were found
      ansible.builtin.assert:
        that: templates.files | length > 0
        fail_msg: "Found no .j2 templates - the discovery glob is broken, not the repo."

    - name: Render every template
      ansible.builtin.template:
        src: "{{ item.path }}"
        dest: "{{ out }}/{{ item.path | basename | regex_replace('\\.j2$', '') }}"
        mode: "0644"
      loop: "{{ templates.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      vars:
        safe_to_disable_passwords: false

    # The shell fragment is sourced by every login; a syntax error in it breaks
    # the user's shell, which lint cannot see.
    - name: Check the rendered shell fragment parses
      ansible.builtin.command: "sh -n {{ out }}/gx10env.sh"
      changed_when: false

    # Both branches of the password-auth conditional must be exercised - the
    # false branch is the one that runs on a fresh node.
    - name: Assert the default branch keeps password auth on
      ansible.builtin.assert:
        that: "'PasswordAuthentication yes' in lookup('file', out ~ '/10-gx10.conf')"
        fail_msg: "the default sshd branch does not leave password auth enabled"

    - name: Render the sshd fragment with passwords disabled
      ansible.builtin.template:
        src: "{{ repo_root }}/roles/remote/templates/10-gx10.conf.j2"
        dest: "{{ out }}/10-gx10-nopass.conf"
        mode: "0644"
      vars:
        safe_to_disable_passwords: true

    - name: Assert the hardened branch disables password auth
      ansible.builtin.assert:
        that: "'PasswordAuthentication no' in lookup('file', out ~ '/10-gx10-nopass.conf')"
        fail_msg: "ssh_disable_passwords=true did not disable password auth"

    # The loop above renders ray.service as the HEAD (rank 0). The worker
    # branch is the one that references cluster_master_ip, so it needs its own
    # pass or a typo there only surfaces on node 2.
    - name: Render the ray unit as a worker
      ansible.builtin.template:
        src: "{{ repo_root }}/roles/ray/templates/ray.service.j2"
        dest: "{{ out }}/ray-worker.service"
        mode: "0644"
      vars:
        cluster_rank: 1
        cluster_index: 11

    - name: Assert the worker branch joins the head
      ansible.builtin.assert:
        that: "'--address=192.168.100.10:6379' in lookup('file', out ~ '/ray-worker.service')"
        fail_msg: "the ray worker branch does not point at the head node"

    # verify_checks.yml is data, not code, so nothing else validates it. A
    # missing `hint` breaks the failure path precisely when a check fails.
    - name: Load the verify checks
      ansible.builtin.include_vars:
        file: "{{ repo_root }}/vars/verify_checks.yml"

    - name: Assert every verify check is well-formed
      ansible.builtin.assert:
        that:
          - item.name is defined
          - item.cmd is defined
          - item.hint is defined
        fail_msg: "verify check {{ item.name | default('(unnamed)') }} is missing name/cmd/hint"
      loop: "{{ verify_checks }}"
      loop_control:
        label: "{{ item.name | default('(unnamed)') }}"

    - name: Report
      ansible.builtin.debug:
        msg: >-
          rendered {{ templates.files | length }} templates,
          validated {{ verify_checks | length }} verify checks
