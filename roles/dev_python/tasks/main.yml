---
# uv is the only Python installer used here. It resolves aarch64 wheels far
# faster than pip and manages interpreters itself, which matters because the
# system Python 3.12 must stay untouched - DGX tooling depends on it.
#
# uv is NOT self-updated by this role. Auto-updating a build-critical tool on
# every run contradicts the goal of two identical machines, and on DGX OS,
# where uv is distro-installed, `uv self update` refuses outright.

- name: Install uv
  ansible.builtin.shell:
    cmd: set -o pipefail && curl -LsSf https://astral.sh/uv/install.sh | sh
    executable: /bin/bash
    creates: "{{ uv_bin }}"
  become_user: "{{ primary_user }}"
  become: true
  environment:
    UV_INSTALL_DIR: "{{ primary_home }}/.local/bin"

# uv_tools carries pinned specs (ruff==0.14.4), not bare names. Unpinned, these
# resolved to whatever was newest on the day each box was provisioned, and
# `uv tool install ruff` also reported changed on every run once a newer ruff
# appeared - so the drift was invisible in the one check that would have caught
# it.
#
# No --quiet: it suppresses all output, including the "Installed" string that
# changed_when tests for, which made these silently report ok forever. The
# no-op message is "`ruff==0.14.4` is already installed", lowercase, so the
# capital I distinguishes them.
- name: Install standalone Python tools with uv
  ansible.builtin.command: "{{ uv_bin }} tool install {{ item }}"
  become_user: "{{ primary_user }}"
  become: true
  loop: "{{ uv_tools }}"
  register: uv_tool_install
  # rc first: on the conflict below uv prints "Installed 1 package" and THEN
  # fails, so testing the string alone would report changed on every run.
  changed_when:
    - uv_tool_install.rc == 0
    - "'Installed' in (uv_tool_install.stderr | default(''))"
  # `uv tool install` exits 2 rather than placing an executable that already
  # exists: "Executable already exists: ruff (use `--force` to overwrite)", or
  # "Executables already exist: ansible, ansible-config, ..." when the package
  # ships several. The test matches the shared substring, because matching the
  # singular alone silently missed every multi-command package - ansible-core
  # among them.
  #
  # On a cluster node that is a real failure - nothing else puts commands in
  # ~/.local/bin there, so a collision means something else is writing to it.
  # On a box this repo only lends an editor to it is the ordinary case and not
  # an error: devbox had its own ruff, NEWER than this pin, from ruff's own
  # installer. Taking that over is a downgrade of somebody's tooling as a side
  # effect of installing an editor. The tool IS installed either way - only its
  # shim in ~/.local/bin is left alone.
  #
  # --force is not the answer on either path: it reinstalls unconditionally, so
  # every apply would report changed and `make idempotence` would fail.
  failed_when: >-
    uv_tool_install.rc != 0
    and (uv_tool_conflict_is_fatal
         or 'already exist' not in (uv_tool_install.stderr | default('')))
