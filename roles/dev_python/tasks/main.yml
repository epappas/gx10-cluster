---
# uv is the only Python installer used here. It resolves aarch64 wheels far
# faster than pip and manages interpreters itself, which matters because the
# system Python 3.12 must stay untouched - DGX tooling depends on it.
#
# uv is NOT self-updated by this role. Auto-updating a build-critical tool on
# every run contradicts the goal of two identical machines, and on DGX OS,
# where uv is distro-installed, `uv self update` refuses outright.

- name: Install uv
  ansible.builtin.shell:
    cmd: set -o pipefail && curl -LsSf https://astral.sh/uv/install.sh | sh
    executable: /bin/bash
    creates: "{{ uv_bin }}"
  become_user: "{{ primary_user }}"
  become: true
  environment:
    UV_INSTALL_DIR: "{{ primary_home }}/.local/bin"

# No --quiet: it suppresses all output, including the "Installed" string that
# changed_when tests for, which made these silently report ok forever.
- name: Install standalone Python tools with uv
  ansible.builtin.command: "{{ uv_bin }} tool install {{ item }}"
  become_user: "{{ primary_user }}"
  become: true
  loop: [ruff, ipython, pre-commit]
  register: uv_tools
  changed_when: "'Installed' in (uv_tools.stderr | default(''))"
