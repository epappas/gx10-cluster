---
- name: Install rustup
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs
      | sh -s -- -y --no-modify-path --default-toolchain {{ rust_channel }}
      --component rustfmt,clippy,rust-src,rust-analyzer
    executable: /bin/bash
    creates: "{{ primary_home }}/.cargo/bin/rustup"
  become_user: "{{ primary_user }}"
  become: true

- name: Update the rust toolchain
  ansible.builtin.command: "{{ primary_home }}/.cargo/bin/rustup update {{ rust_channel }}"
  become_user: "{{ primary_user }}"
  become: true
  register: rustup_update
  changed_when: "'updated' in (rustup_update.stdout | default(''))"

# apt where a build exists, cargo for the rest. This split IS the config -
# there is no variable for it, because which tool has a Debian package is a
# fact about Ubuntu, not a preference. Note apt names the binaries batcat and
# fdfind; the shell role aliases those back.
- name: Install rust CLI tools available from apt
  ansible.builtin.apt:
    name: [bat, fd-find, zoxide]
    state: present
  become: true

- name: Install remaining rust CLI tools with cargo
  ansible.builtin.command: "{{ primary_home }}/.cargo/bin/cargo install --locked {{ item }}"
  args:
    creates: "{{ primary_home }}/.cargo/bin/{{ item }}"
  become_user: "{{ primary_user }}"
  become: true
  loop: [eza, tokei, hyperfine]
  async: 1800
  poll: 30
