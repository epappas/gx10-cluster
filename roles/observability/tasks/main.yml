---
# The heavyweight monitoring stack. NOT installed by site.yml.
#
# Cost, measured from apt: prometheus 105 MB on disk plus a TSDB in RAM,
# grafana a Go server on top, DCGM another 48 MB. On a box where host memory
# IS GPU memory, that is model capacity spent watching the machine rather than
# using it - which is why `gx10-status` (roles/monitoring) is the default and
# this is opt-in.
#
# Two tiers, one per task file, so you can take the cheap half without the
# expensive half:
#
#   tasks/exporters.yml    node_exporter + GPU textfile collector (~13 MB,
#                          ~20 MB RSS). Enough for something ELSE to scrape.
#   tasks/dashboards.yml   the above plus prometheus and grafana ON THIS BOX.
#
# This file is the refusal, not a third tier. The two tiers used to be tags on
# a single main.yml, and it did not work: task tags are additive with the tags
# on the role, so every task carried both and `--tags exporters` installed
# grafana. Making main.yml quietly include both would restore the same
# surprise by a different route - you would ask for the role and get the TSDB.
# Making it a no-op is worse still, because a silent success reads as an
# install. So it fails, and says where to go instead.
#
# Prefer running prometheus and grafana off this box entirely; see
# docs/runbooks/monitoring.md.

- name: Refuse a tierless include of this role
  ansible.builtin.fail:
    msg: >-
      roles/observability has no default entry point - pick a tier.
      `make optional TAGS=exporters` for node_exporter and the GPU textfile
      collector; `make optional TAGS=dashboards` for that plus prometheus and
      grafana on this box, which costs model capacity. From a playbook, use
      include_role with tasks_from: exporters or tasks_from: dashboards, as
      optional.yml does. See docs/runbooks/monitoring.md.
