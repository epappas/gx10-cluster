---
# ===========================================================================
# Two-node GX10 interconnect over the ConnectX-7 QSFP ports.
#
# Two platform facts drive everything here:
#
# 1. The CX-7 is NOT on the PCI bus until a cable links the two boxes -
#    dgx-spark-mlnx-hotplug brings it up on link detect. On an uncabled
#    machine there is no mlx5 device and nothing to address.
#
# 2. ONE cabled QSFP port presents TWO logical interfaces, on two PCIe x4
#    partitions, which must be on DIFFERENT subnets. Configuring only one caps
#    the link at half its bandwidth, silently. Addresses follow NVIDIA's
#    connect-two-sparks playbook.
#
#    MEASURED, because this is easy to misread as two cabled ports: all four
#    netdevs share one phys_switch_id (94cedc00039fada0 - a single ConnectX-7
#    ASIC), and enp1s0f0np0 / enP2p1s0f0np0 both report phys_port_name=p0, ie
#    the SAME physical cage. They differ only in PCIe root complex
#    (0000:01:00.0 and 0002:01:00.0). One Amphenol NJAAKK-AU06 1 m DAC is
#    plugged into p0; both nodes read the same module serial off it, which is
#    how you know it is one cable and not two. Port p1 is uncabled and its two
#    netdevs (enp1s0f1np1, enP2p1s0f1np1) are correctly DOWN.
#
#    The ceiling is the CABLE, not the bus: two Gen5 x4 partitions total
#    ~252 Gb/s of PCIe behind a single 200 Gb/s port, so the wire binds first.
#
# 3. The link layer is ETHERNET and the fabric is RoCE v2. There is no
#    InfiniBand subnet, no subnet manager and no LIDs, so ibhosts, iblinkinfo
#    and ibnetdiscover all fail with "can't open UMAD port" on a perfectly
#    healthy cluster. That indistinguishability - a working fabric and a
#    missing one looking identical - is why gx10-interconnect exists below.
#
# Addressing uses nmcli, NOT netplan. This host is NetworkManager-rendered,
# and `netplan apply` unconditionally runs `nmcli device disconnect` on every
# NM-managed device and then stops NetworkManager (see netplan's own
# apply.py). On a box whose only link is WiFi - and on node 2, provisioned
# over SSH - that severs the connection the play is running over.
# ===========================================================================

# infiniband-diags is installed for ibstat / ibstatus / ibdev2netdev, which do
# work here. Its FABRIC tools (ibhosts, ibnodes, iblinkinfo, ibnetdiscover) do
# not and cannot: they send InfiniBand SMPs to a subnet manager over /dev/
# infiniband/umad*, and a RoCE port has no SM to answer. Their failure is not a
# symptom - see fact 3 above. opensm is deliberately NOT installed; a subnet
# manager on an Ethernet link layer manages nothing.
- name: Install RDMA and InfiniBand tooling
  ansible.builtin.apt:
    name:
      - rdma-core
      - ibverbs-utils
      - infiniband-diags
      - perftest
    state: present
  become: true

# --- Name resolution between the nodes -------------------------------------
#
# The bare node name resolves to the MANAGEMENT address, and `<node>.cluster`
# to the interconnect. That split matters, and the reverse (which this file
# had) is a trap:
#
#   - The ConnectX-7 is not on the PCI bus until a cable links the boxes, so
#     with no cable the interconnect addresses exist nowhere. Pointing the node
#     names at them means `ssh poseidon`, torchrun's rendezvous and every health
#     check fail on an uncabled pair - which is most of the time you are
#     setting one up.
#   - It bought nothing. The rendezvous address does NOT decide the collective
#     transport: NCCL picks that independently, RoCE over ibverbs for the data
#     path and NCCL_SOCKET_IFNAME (the management NIC) for bootstrap. So
#     control traffic was riding the interconnect and the fast path was
#     unaffected either way.
#
# Control plane on the always-up link, data plane on the cable. Reach for
# `<node>.cluster` when you explicitly want the 200G path.
- name: Add cluster hosts to /etc/hosts
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} ANSIBLE MANAGED - gx10 cluster"
    # PEERS only for the bare name. roles/base already maps this node's own
    # name to its routable address, outside this block - if both wrote it, the
    # lineinfile there and this blockinfile would each rewrite the other's copy
    # on every run, and `make idempotence` would never settle. The `.cluster`
    # names are all emitted here, self included, because the interconnect
    # address is this role's business and nothing else writes it.
    block: |
      {% for h in groups['gx10'] %}
      {% if h != inventory_hostname %}
      {{ hostvars[h].ansible_host }}  {{ h }}
      {% endif %}
      {{ cluster_subnets[0] }}.{{ hostvars[h].cluster_index }}  {{ h }}.cluster
      {% endfor %}
  become: true

# --- Passwordless SSH between the nodes ------------------------------------
# torchrun and mpirun launch remote workers over SSH, so the nodes need key
# auth to each other, not just from your laptop.
- name: Generate an inter-node SSH key
  community.crypto.openssh_keypair:
    path: "{{ primary_home }}/.ssh/id_gx10_cluster"
    type: ed25519
    comment: "gx10 cluster inter-node"
    owner: "{{ primary_user }}"
    group: "{{ primary_user }}"
    mode: "0600"
    # Without this, changing `type:` later silently invalidates every key
    # already authorized across the cluster.
    regenerate: never
  become: true
  register: cluster_key

# The cross-authorization deliberately does NOT live here. With `serial: 1`
# host A completes this entire play before host B starts, so B's key does not
# exist yet when A runs - trust would never be established in either
# direction. It happens in the "Establish inter-node trust" play at the end of
# site.yml, which runs once every host has finished this one.

# Three names per node, one per path, matching the split described above:
#
#   poseidon          management  - the always-up LAN address
#   poseidon.cluster  interconnect - the 200G cable, absent until cabled
#   poseidon.nord     Meshnet      - reachable from off the LAN entirely
#
# The .nord alias maps to the Meshnet NICKNAME rather than the name Nord
# generates, because the generated one is random and gets recycled: poseidon
# registered as epappas-everest.nord, a name that belonged to a Windows box an
# hour earlier. Pinning ssh config to that would break the first time a device
# is removed and re-added. Skipped entirely when nordvpn_nickname is empty.
- name: Configure SSH to use the cluster key between nodes
  ansible.builtin.blockinfile:
    path: "{{ primary_home }}/.ssh/config"
    marker: "# {mark} ANSIBLE MANAGED - gx10 cluster"
    create: true
    owner: "{{ primary_user }}"
    group: "{{ primary_user }}"
    mode: "0600"
    block: |
      {% for h in groups['gx10'] %}
      Host {{ h }}
          HostName {{ hostvars[h].ansible_host }}
          User {{ primary_user }}
          IdentityFile ~/.ssh/id_gx10_cluster
          StrictHostKeyChecking accept-new

      Host {{ h }}.cluster
          HostName {{ cluster_subnets[0] }}.{{ hostvars[h].cluster_index }}
          User {{ primary_user }}
          IdentityFile ~/.ssh/id_gx10_cluster
          StrictHostKeyChecking accept-new
      {% if hostvars[h].nordvpn_nickname | default('') | length > 0 %}

      Host {{ h }}.nord
          HostName {{ hostvars[h].nordvpn_nickname }}.nord
          User {{ primary_user }}
          IdentityFile ~/.ssh/id_gx10_cluster
          StrictHostKeyChecking accept-new
      {% endif %}
      {% endfor %}
  become: true

# ===========================================================================
# Hardware-dependent half - skips cleanly when the cable is not connected.
# ===========================================================================
# NOTE the explicit `exit 0`. A `for` loop's exit status is that of its last
# iteration, so the natural `[ carrier = 1 ] && echo "$iface"` form returns 1
# whenever the alphabetically-last mlx5 device is not the linked one - which
# on a CABLED box (4 devices, 2 linked) is a coin flip. With `pipefail` that
# became the task's status, and with any_errors_fatal it killed the run at the
# very end of provisioning with only "non-zero return code" to go on.
- name: Detect ConnectX (mlx5) interfaces that have carrier
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      for d in /sys/class/net/*/device/driver; do
        [ -e "$d" ] || continue
        [ "$(basename "$(readlink -f "$d")")" = "mlx5_core" ] || continue
        iface=$(basename "$(dirname "$(dirname "$d")")")
        # Only the pair belonging to the cabled port carries a link; the other
        # pair exists but is down. Configuring those would be silently wrong.
        if [ "$(cat "/sys/class/net/$iface/carrier" 2>/dev/null)" = "1" ]; then
          printf '%s\n' "$iface"
        fi
      done | sort
      exit 0
    executable: /bin/bash
  register: mlx_ifaces
  changed_when: false
  # Reads /sys and nothing else, so it is safe under --check - and it has to
  # run there, because everything below keys off its output. Skipped (the
  # default for shell in check mode) it registers no stdout, cluster_ifaces
  # comes out empty, and `make diff` on a correctly cabled pair reports "No
  # ConnectX-7 interface with carrier" and shows the addressing as unnecessary.
  # A dry run that hides the work it would do is worse than no dry run.
  check_mode: false

- name: Record interconnect state
  ansible.builtin.set_fact:
    cluster_ifaces: "{{ mlx_ifaces.stdout_lines | default([]) }}"
    cluster_link_present: "{{ (mlx_ifaces.stdout_lines | default([])) | length > 0 }}"

- name: Explain a missing interconnect
  ansible.builtin.debug:
    msg: >-
      No ConnectX-7 interface with carrier on {{ ansible_facts['hostname'] }}. On GX10
      the NIC appears via PCIe hotplug only once a QSFP cable links the two
      boxes. Cable them and re-run: ansible-playbook site.yml --tags cluster
  when: not cluster_link_present

- name: Warn if only one interconnect partition is up
  ansible.builtin.debug:
    msg: >-
      Only {{ cluster_ifaces | length }} ConnectX interface(s) have carrier:
      {{ cluster_ifaces | join(', ') }}. The cabled QSFP port presents two PCIe
      partitions and both are needed for full bandwidth. Check the cable.
  when:
    - cluster_link_present | bool
    - cluster_ifaces | length < 2

# Each detected partition gets an address on its own subnet - partition 0 on
# cluster_subnets[0], partition 1 on cluster_subnets[1]. Both on one subnet is
# explicitly unsupported by NVIDIA.
- name: Configure the interconnect partitions
  community.general.nmcli:
    conn_name: "gx10-cluster-{{ idx }}"
    ifname: "{{ iface }}"
    type: ethernet
    ip4: "{{ cluster_subnets[idx] }}.{{ cluster_index }}/{{ cluster_subnet_prefix }}"
    # No gateway, no DNS, never the default route: this is a point-to-point
    # cable, not a path to anywhere. Routing stays on WiFi/LAN.
    never_default4: true
    mtu: "{{ cluster_mtu | default(omit, true) }}"
    autoconnect: true
    state: present
  become: true
  # NM does not push a profile change onto an already-active connection, so an
  # MTU edit lands in the profile and not on the wire without this. See the
  # handler for the measurement.
  notify: Reactivate the interconnect partitions
  loop: "{{ cluster_ifaces[: cluster_subnets | length] }}"
  loop_control:
    index_var: idx
    loop_var: iface
  when: cluster_link_present | bool

# --- NCCL ------------------------------------------------------------------
# Written AFTER detection - the previous version templated this before
# cluster_link_present existed, so its interface-binding branch was dead code
# that could never render.
- name: Write system-wide NCCL configuration
  ansible.builtin.template:
    src: nccl.conf.j2
    dest: /etc/nccl.conf
    mode: "0644"
  become: true

# copy does not create intermediate directories.
- name: Ensure the cluster directory exists
  ansible.builtin.file:
    path: "{{ primary_home }}/cluster"
    state: directory
    owner: "{{ primary_user }}"
    group: "{{ primary_user }}"
    mode: "0755"
  become: true

- name: Install the two-node all-reduce benchmark
  ansible.builtin.copy:
    src: allreduce_test.py
    dest: "{{ primary_home }}/cluster/allreduce_test.py"
    owner: "{{ primary_user }}"
    group: "{{ primary_user }}"
    mode: "0755"
  become: true

# --- Making the fabric legible ---------------------------------------------
#
# The whole reason this exists: on RoCE, every InfiniBand-native way of asking
# "are the boxes connected?" returns nothing, and nothing reads as "no". A
# reader who trusts ibhosts concludes the cluster is unlinked while 21.6 GB/s
# of NCCL traffic is crossing it. gx10-interconnect answers the question about
# the fabric that is actually present, and exits non-zero when it is not.
#
# Installed unconditionally, including on an uncabled node - that is exactly
# when someone needs it to say "no NIC yet, this is expected" rather than
# leaving them to interpret an empty ibv_devices.
- name: Ensure the cluster tool config directory exists
  ansible.builtin.file:
    path: /etc/gx10
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Write the interconnect peer list
  ansible.builtin.template:
    src: interconnect.peers.j2
    dest: /etc/gx10/interconnect.peers
    owner: root
    group: root
    mode: "0644"
  become: true

# /usr/local/bin, not ~/.local/bin where gx10-status lives. The deciding case
# is `ssh <node> gx10-interconnect`: that is a NON-login shell, which never
# sources the profile snippet that puts ~/.local/bin on PATH. A diagnostic
# whose job is to be found by whatever is asking - a script, an agent, a
# one-shot SSH - has to be somewhere the default PATH already looks.
- name: Install the interconnect diagnostic
  ansible.builtin.copy:
    src: gx10-interconnect
    dest: /usr/local/bin/gx10-interconnect
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Report interconnect status
  ansible.builtin.debug:
    msg: >-
      Interconnect: {{ cluster_ifaces | join(', ') }} on
      {% for s in cluster_subnets[: cluster_ifaces | length] %}{{ s }}.{{ cluster_index }} {% endfor %}
  when: cluster_link_present | bool
