---
# ===========================================================================
# Two-node GX10 interconnect over the ConnectX-7 QSFP ports.
#
# Important platform behaviour: on GX10 the ConnectX-7 is NOT on the PCI bus
# until a cable links the two boxes. dgx-spark-mlnx-hotplug brings it up via
# PCIe hotplug when a link is detected. So on an uncabled machine there is no
# mlx5 device, no ibv device, and nothing to address.
#
# This role therefore splits into two halves:
#   1. Things that are always safe    - packages, hosts, keys, NCCL config
#   2. Things that need the hardware  - IP addressing, MTU, link verification
# The second half skips cleanly when the cable is not in.
# ===========================================================================

- name: Install RDMA and InfiniBand tooling
  ansible.builtin.apt:
    name:
      - rdma-core
      - ibverbs-utils
      - ibverbs-providers
      - infiniband-diags
      - perftest
      - libibverbs-dev
      - librdmacm-dev
    state: present
  become: true

- name: Ensure RDMA kernel modules load at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/gx10-rdma.conf
    mode: "0644"
    content: |
      # Managed by gx10-cluster ansible.
      ib_core
      ib_uverbs
      rdma_ucm
      mlx5_core
      mlx5_ib
  become: true

- name: Enable the rdma service
  ansible.builtin.systemd:
    name: rdma-load-modules@rdma.service
    enabled: true
  become: true
  failed_when: false

# --- Name resolution between the nodes -------------------------------------
# Static entries on the interconnect subnet so torchrun/NCCL/mpirun address
# each other over the 200G link and never over WiFi.
- name: Add cluster hosts to /etc/hosts
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} ANSIBLE MANAGED - gx10 cluster"
    block: |
      {% for h in groups['gx10'] %}
      {{ hostvars[h].cluster_ip }}  {{ h }} {{ h }}.cluster
      {% endfor %}
  become: true

# --- Passwordless SSH between the nodes ------------------------------------
# torchrun and mpirun launch remote workers over SSH; they need key auth
# between the nodes themselves, not just from your laptop.
- name: Generate an inter-node SSH key
  community.crypto.openssh_keypair:
    path: "{{ primary_home }}/.ssh/id_gx10_cluster"
    type: ed25519
    comment: "gx10 cluster inter-node"
    owner: "{{ primary_user }}"
    group: "{{ primary_user }}"
    mode: "0600"
  become: true
  register: cluster_key

- name: Authorize every node's cluster key on this node
  ansible.posix.authorized_key:
    user: "{{ primary_user }}"
    key: "{{ hostvars[item].cluster_key.public_key }}"
    comment: "gx10 cluster - {{ item }}"
    state: present
  become: true
  loop: "{{ groups['gx10'] }}"
  when: hostvars[item].cluster_key is defined

- name: Configure SSH to use the cluster key between nodes
  ansible.builtin.blockinfile:
    path: "{{ primary_home }}/.ssh/config"
    marker: "# {mark} ANSIBLE MANAGED - gx10 cluster"
    create: true
    owner: "{{ primary_user }}"
    group: "{{ primary_user }}"
    mode: "0600"
    block: |
      {% for h in groups['gx10'] %}
      Host {{ h }} {{ h }}.cluster {{ hostvars[h].cluster_ip }}
          User {{ primary_user }}
          IdentityFile ~/.ssh/id_gx10_cluster
          StrictHostKeyChecking accept-new
      {% endfor %}
  become: true

# --- NCCL configuration ----------------------------------------------------
- name: Write system-wide NCCL configuration
  ansible.builtin.template:
    src: nccl.conf.j2
    dest: /etc/nccl.conf
    mode: "0644"
  become: true

- name: Install the two-node all-reduce benchmark
  ansible.builtin.copy:
    src: allreduce_test.py
    dest: "{{ primary_home }}/cluster/allreduce_test.py"
    owner: "{{ primary_user }}"
    group: "{{ primary_user }}"
    mode: "0755"
  become: true

- name: Install the cluster launch helper
  ansible.builtin.template:
    src: cluster-run.sh.j2
    dest: "{{ primary_home }}/.local/bin/cluster-run"
    owner: "{{ primary_user }}"
    group: "{{ primary_user }}"
    mode: "0755"
  become: true

# ===========================================================================
# Hardware-dependent half
# ===========================================================================
- name: Detect ConnectX (mlx5) network interfaces
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      for d in /sys/class/net/*/device/driver; do
        [ -e "$d" ] || continue
        drv=$(basename "$(readlink -f "$d")")
        if [ "$drv" = "mlx5_core" ]; then
          basename "$(dirname "$(dirname "$d")")"
        fi
      done
    executable: /bin/bash
  register: mlx_ifaces
  changed_when: false
  failed_when: false

- name: Record whether the interconnect is present
  ansible.builtin.set_fact:
    cluster_iface: "{{ (mlx_ifaces.stdout_lines | default([])) | first | default('') }}"
    cluster_link_present: "{{ (mlx_ifaces.stdout_lines | default([])) | length > 0 }}"

- name: Explain a missing interconnect
  ansible.builtin.debug:
    msg: >-
      No ConnectX-7 interface found on {{ ansible_hostname }}. On GX10 the
      NIC appears via PCIe hotplug only once a QSFP cable links the two
      boxes. Cable them together and re-run: ansible-playbook site.yml
      --tags cluster
  when: not cluster_link_present

- name: Configure the interconnect interface
  when: cluster_link_present | bool
  block:
    - name: Write netplan config for the interconnect
      ansible.builtin.template:
        src: 90-gx10-cluster.yaml.j2
        dest: /etc/netplan/90-gx10-cluster.yaml
        mode: "0600"
      become: true
      register: netplan_cfg

    - name: Apply netplan
      ansible.builtin.command: netplan apply
      become: true
      when: netplan_cfg.changed
      changed_when: true   # only runs when the config above actually changed

    - name: Show RDMA devices
      ansible.builtin.command: ibv_devinfo
      register: ibv_out
      changed_when: false
      failed_when: false

    - name: Report RDMA status
      ansible.builtin.debug:
        msg: >-
          Interconnect {{ cluster_iface }} configured as
          {{ cluster_ip }}/{{ cluster_subnet_prefix }} (MTU {{ cluster_mtu }}).
          RDMA: {{ 'available' if ibv_out.rc == 0 else 'ibv_devinfo returned nothing' }}
