# Managed by gx10-cluster ansible (installed once; local edits are preserved).

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -sg escape-time 10
set -g renumber-windows on

# Long training runs disconnect; keep the session alive and readable.
set -g status-interval 5
set -g status-right "#[fg=cyan]#(nvidia-smi --query-gpu=utilization.gpu,memory.used --format=csv,noheader,nounits | awk -F', ' '{print $1\"%% \"$2\"MiB\"}') #[fg=default]| %H:%M"
set -g status-right-length 60

# Split panes in the current directory.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind r source-file ~/.tmux.conf \; display "reloaded"
