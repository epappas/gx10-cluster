# Managed by gx10-cluster ansible. Put your own settings in ~/.tmux.conf.local,
# which is sourced at the end and never touched by the play.
#
# This is the devbox config, ported to the cluster. Where the two disagreed the
# GX10-specific choice won and says why below: scrollback, status interval and
# the GPU readout in the status bar are sized for a box that runs multi-hour
# training jobs, not for a laptop-facing dev shell.

# Ctrl-a, not the default Ctrl-b. `bind C-a send-prefix` is what keeps Ctrl-a
# usable INSIDE the pane - without it, readline's beginning-of-line (and the
# same binding in vim, emacs and psql) is swallowed by tmux and unreachable.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- Terminal --------------------------------------------------------------
set -g default-terminal "tmux-256color"
# Truecolor for clients that advertise as xterm-256color (Termius does).
# terminal-features, not the older `terminal-overrides ",*256col*:Tc"`: both
# express the same thing, but features is the form tmux has wanted since 3.2
# and all three boxes here run 3.4.
set -as terminal-features ",xterm*:RGB"

# 50000, not the devbox's 5000. A training run that dies at hour three puts the
# traceback tens of thousands of lines above the prompt; 5000 has already
# scrolled it away by the time you reattach.
set -g history-limit 50000

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 0
set -g focus-events on

# set-clipboard lets a copy inside tmux reach the LOCAL clipboard over OSC 52,
# which is the only path that works when the pane is three SSH hops deep.
# allow-passthrough lets a program in the pane emit its own escape sequences
# untouched - what image protocols and progress-bar renderers need.
set -g set-clipboard on
set -g allow-passthrough on

# --- Status bar ------------------------------------------------------------
set -g status-position top
# 5s, not the devbox's 30s. This bar shows live GPU utilisation; at 30s
# granularity you cannot tell a stalled dataloader from a busy one, which is
# the whole reason the readout is there.
set -g status-interval 5

set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=#89b4fa,bold] #S #[fg=#585b70]| "

# GPU util plus host memory. NOT nvidia-smi's memory.used: on GB10 there is no
# framebuffer, so it reports [N/A] and the bar renders "[N/A]MiB". Memory is
# unified, which makes `free` the honest number anyway.
#
# %% is a literal percent - a bare % in a status string is a strftime spec.
set -g status-right "#[fg=#a6e3a1]gpu #(nvidia-smi --query-gpu=utilization.gpu --format=csv,noheader,nounits)%% #[fg=#f9e2af]mem #(free -g | awk '/^Mem:/{print $3\"/\"$2\"G\"}') #[fg=#585b70]| #[fg=#a6adc8]%H:%M #[fg=#585b70]| #[fg=#a6adc8]%d-%b"

setw -g window-status-format "#[fg=#585b70] #I:#W "
setw -g window-status-current-format "#[fg=#89b4fa,bold] #I:#W "

set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# --- Panes and windows -----------------------------------------------------
# Split and open in the current directory, not in $HOME.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- Neovim-aware pane navigation ------------------------------------------
# Ctrl-h/j/k/l move between tmux panes AND neovim splits with the same four
# keys, prefix-free. This is one half of vim-tmux-navigator; the other half is
# the plugin in roles/editor's config, and NEITHER half works alone - with only
# this file you get keys that leave nvim but never come back.
#
# The check is on the process running in the target pane: if it is vim or
# neovim, the key is forwarded and nvim decides whether there is a split that
# way (handing control back to tmux when there is not). The regex excludes
# stopped/zombie processes (the ^[^TXZ ]+ part) because a suspended editor is
# not one that can answer.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# C-l was clear-screen before the binding above took it. This gives it back,
# one keystroke further away, rather than leaving the shell without it.
bind C-l send-keys 'C-l'

# The same four keys inside copy-mode, where there is no process to ask.
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

# --- Working the session ---------------------------------------------------
# prefix f: switch to another project's session, or create it, from a fuzzy
# list of ~/src, this repo and anywhere zoxide has seen you work. This is the
# binding that makes one tmux server per box the norm rather than a pile of
# half-remembered sessions. The script is ~/.local/bin/gx10-sessionizer.
bind f display-popup -E -w 60% -h 50% 'gx10-sessionizer'

# prefix e: the editor, in a new window, in this pane's directory.
bind e new-window -c "#{pane_current_path}" 'nvim'

# prefix g: git status over the whole screen, then a shell in the same
# directory - so `git add -p` is one key away from the diff you just read.
bind g display-popup -E -w 90% -h 85% -d "#{pane_current_path}" \
    'git status && exec $SHELL'

# prefix G: the cluster, over the whole screen. gx10-top polls BOTH nodes, so
# this answers "is the other box busy" without an ssh.
bind G display-popup -E -w 90% -h 85% 'gx10-top'

# -r repeats, so HJKL can be held to resize without re-pressing the prefix.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Copy mode -------------------------------------------------------------
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel
bind ] paste-buffer

bind r source-file ~/.tmux.conf \; display "reloaded"

# Last, so it wins over anything above. -q keeps tmux quiet when it is absent,
# which is the normal case. This file is where local edits belong now that the
# play owns ~/.tmux.conf outright.
source-file -q ~/.tmux.conf.local
