---
# Starship was removed rather than pinned. It was `curl | sh` into root's
# shell, unpinned, from a third-party domain - the same pattern this repo
# refuses everywhere else - and what it bought was a prompt theme. zoxide and
# fzf still get wired up in gx10env.sh.
#
# The prompt was then left to the shell, which on zsh means bare `<host>%`.
# That is now set in gx10env.sh too - user@host, path and git branch, built
# from zsh's own vcs_info, so it costs no fork and no third-party binary.

- name: Ensure user bin directory exists
  ansible.builtin.file:
    path: "{{ primary_home }}/.local/bin"
    state: directory
    owner: "{{ primary_user }}"
    group: "{{ primary_user }}"
    mode: "0755"
  become: true

# `ws` is the workspaces entry point, and every runbook in this repo spells it
# bare. It was only ever reachable as ./workspaces/ws, so those instructions
# were aspirational unless you happened to be standing in the repo root.
#
# A SYMLINK, not a copy. `ws` resolves its own WS_ROOT with
# `readlink -f "$0"`, so the link lands it back in the checkout and it finds
# lib/common.sh and the workspace tree. A copy would find neither, and would
# also go stale the moment the repo moved on.
#
# ~/.local/bin, NOT /usr/local/bin like gx10-top and gx10-storage. Those live
# there because something launches them from a non-login shell - a tmux popup,
# an ssh fan-out - that never sources ~/.gx10env.sh. `ws` is only ever typed by
# a person at a prompt, and it is deliberately unprivileged: see the header of
# workspaces/ws for why the workspaces half of this repo is not Ansible.
# The stat is on workspaces/ws itself, NOT on gx10_repo_dir, and that is
# load-bearing: the two-node workspaces mkdir their own path under the same
# name on the peer, so poseidon has a ~/gx10-cluster/workspaces/inference/...
# tree and no checkout at all. A directory test would have linked ws to a file
# that is not there, on the node where nobody types it.
- name: Check whether this node holds a checkout of the repo
  ansible.builtin.stat:
    path: "{{ gx10_repo_dir }}/workspaces/ws"
  register: gx10_ws_entrypoint

- name: Link the workspaces entry point onto PATH
  ansible.builtin.file:
    src: "{{ gx10_repo_dir }}/workspaces/ws"
    dest: "{{ primary_home }}/.local/bin/ws"
    state: link
    # Operate on the LINK, not on what it points at. With the default the
    # module would chown workspaces/ws itself in the checkout, which is a
    # tracked file and not this role's to own.
    follow: false
    owner: "{{ primary_user }}"
    group: "{{ primary_user }}"
  become: true
  when: gx10_ws_entrypoint.stat.exists

# One environment fragment sourced by both shells, so PATH and CUDA settings
# are defined once instead of drifting between bash and zsh.
- name: Install shared shell environment
  ansible.builtin.template:
    src: gx10env.sh.j2
    dest: "{{ primary_home }}/.gx10env.sh"
    owner: "{{ primary_user }}"
    group: "{{ primary_user }}"
    mode: "0644"
  become: true

- name: Source the shared environment from bash and zsh
  ansible.builtin.blockinfile:
    path: "{{ primary_home }}/{{ item }}"
    block: |
      [ -f "$HOME/.gx10env.sh" ] && . "$HOME/.gx10env.sh"
    marker: "# {mark} ANSIBLE MANAGED - gx10 environment"
    create: true
    owner: "{{ primary_user }}"
    group: "{{ primary_user }}"
    mode: "0644"
  become: true
  loop: [.bashrc, .zshrc]

# force: true, deliberately. This was `force: false` to protect local edits,
# but a file the repo ships and can then never update is a file that drifts -
# change the prefix key here and no existing box ever sees it, which is the
# opposite of this repo's claim. Local customisation moved to
# ~/.tmux.conf.local, sourced at the end of the shipped config and never
# written by the play, so it survives every run.
- name: Install tmux configuration
  ansible.builtin.copy:
    src: tmux.conf
    dest: "{{ primary_home }}/.tmux.conf"
    owner: "{{ primary_user }}"
    group: "{{ primary_user }}"
    mode: "0644"
    force: true
  become: true

# /usr/local/bin, not ~/.local/bin, for the same reason as gx10-top in
# roles/monitoring: it is launched by `tmux display-popup`, which runs the
# command through a NON-LOGIN shell that never sources ~/.gx10env.sh and so
# never gets ~/.local/bin on PATH. The binding would fail with "command not
# found" on a box where the script is plainly installed.
- name: Install the tmux sessionizer
  ansible.builtin.copy:
    src: gx10-sessionizer
    dest: /usr/local/bin/gx10-sessionizer
    owner: root
    group: root
    mode: "0755"
  become: true

# ansible.builtin.user does not validate the shell path. Setting a login shell
# that does not exist means sshd cannot exec it and every connection closes
# immediately - a second, independent lockout path.
- name: Check the target login shell exists
  ansible.builtin.stat:
    path: "{{ default_shell }}"
  register: shell_bin

- name: Set the login shell
  ansible.builtin.user:
    name: "{{ primary_user }}"
    shell: "{{ default_shell }}"
  become: true
  when: shell_bin.stat.exists
