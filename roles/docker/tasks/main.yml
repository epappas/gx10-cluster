---
# Docker and the NVIDIA Container Toolkit ship with DGX OS. This role
# CONFIGURES; it must never install a Docker packaging.
#
# DGX OS carries Docker's own packages (docker-ce, docker-ce-cli,
# containerd.io) from repo.download.nvidia.com/baseos at pin priority 600,
# plus the nv-docker-gpus / nv-docker-options integration packages. Asking apt
# for Ubuntu's docker.io / docker-buildx / docker-compose-v2 is unsatisfiable:
#
#   containerd.io : Conflicts: containerd
#   E: Error, pkgProblemResolver::Resolve generated breaks
#
# which fails the task and aborts the play before any later role runs.

- name: Verify docker is present
  ansible.builtin.command: docker --version
  register: docker_version
  changed_when: false
  check_mode: false   # read-only; must run under --check too

- name: Verify the NVIDIA Container Toolkit is present
  ansible.builtin.command: nvidia-ctk --version
  register: ctk_version
  changed_when: false
  check_mode: false

- name: Report docker versions
  ansible.builtin.debug:
    msg: "{{ docker_version.stdout }} | {{ ctk_version.stdout_lines | first }}"

- name: Add primary user to the docker group
  ansible.builtin.user:
    name: "{{ primary_user }}"
    groups: docker
    append: true
  become: true
  register: docker_group

- name: Note that a re-login is needed for docker group membership
  ansible.builtin.debug:
    msg: >-
      {{ primary_user }} was added to the docker group. Log out and back in
      (or run `newgrp docker`) before docker works without sudo.
  when: docker_group.changed

# nvidia-ctk rewrites daemon.json and logs "Wrote updated config" on EVERY
# invocation - there is no unchanged path - so running it unconditionally
# makes this task report changed forever and breaks `make idempotence`.
# Ask docker what it is already using and skip when it is correct.
- name: Check whether the NVIDIA runtime is already the default
  ansible.builtin.command: docker info --format '{{ '{{' }}.DefaultRuntime{{ '}}' }}'
  become: true
  register: docker_runtime
  changed_when: false
  check_mode: false
  failed_when: false

- name: Register the NVIDIA runtime with the docker daemon
  ansible.builtin.command: nvidia-ctk runtime configure --runtime=docker --set-as-default
  become: true
  when: (docker_runtime.stdout | default('') | trim) != 'nvidia'
  changed_when: true
  notify: Restart docker

# nvidia-ctk owns the "runtimes" and "default-runtime" keys, so read and merge
# rather than overwrite - a plain template here would strip the GPU runtime
# registration made by the task above.
- name: Read existing docker daemon.json
  ansible.builtin.slurp:
    src: /etc/docker/daemon.json
  become: true
  register: daemon_json_raw
  # Tolerate only "not there yet"; any other read failure must surface,
  # because falling back to {} would silently discard the runtimes block.
  failed_when:
    - daemon_json_raw.failed | default(false)
    - "'not exist' not in (daemon_json_raw.msg | default(''))"
    - "'No such file' not in (daemon_json_raw.msg | default(''))"

- name: Merge GX10 defaults into daemon.json
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    mode: "0644"
    backup: true
    content: |
      {{
        ((daemon_json_raw.content | b64decode | from_json)
           if (daemon_json_raw.content is defined) else {})
        | combine(docker_gx10_defaults, recursive=true)
        | to_nice_json(indent=2)
      }}
  become: true
  notify: Restart docker

- name: Enable and start docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
  become: true
