---
# Observability with ZERO resident cost.
#
# On a unified-memory box every MB a monitoring daemon holds is a MB the model
# cannot use, and CPU cycles spent scraping are cycles not spent on the job.
# Prometheus alone is 105 MB on disk plus a TSDB in RAM; Grafana adds a Go
# server on top. That is real capacity spent watching a machine instead of
# using it.
#
# So the default is a script you run, not a service that runs. The full
# Prometheus/Grafana stack is still available - see roles/observability, which
# only optional.yml installs, and which is better run OFF this box entirely.

- name: Install the status tool
  ansible.builtin.copy:
    src: gx10-status
    dest: "{{ primary_home }}/.local/bin/gx10-status"
    owner: "{{ primary_user }}"
    group: "{{ primary_user }}"
    mode: "0755"
  become: true

# gx10-status prints free space and the size of the HF cache, which on a real
# box accounts for a minority of what is used - MEASURED here, 175 GB of 660.
# The rest sits in /var/tmp and /var/lib, which nobody thinks to du, so the
# first anyone knows about it is `make models` refusing or a job dying on ENOSPC.
#
# /usr/local/bin, not ~/.local/bin beside gx10-status: it is invoked over SSH by
# its own --cluster fan-out, and a non-login shell never gets ~/.local/bin on
# PATH. Same reasoning as gx10-top.
- name: Install the storage tool
  ansible.builtin.copy:
    src: gx10-storage
    dest: /usr/local/bin/gx10-storage
    owner: root
    group: root
    mode: "0755"
  become: true

# ---------------------------------------------------------------------------
# History, still with no resident cost.
#
# gx10-status answers "what is happening now". Nothing answered "what happened
# at 03:00", and on this box the two failures that quietly ruin an overnight
# run - a thermal/power cap and a swap excursion - are both invisible by
# morning. A timer is not a daemon: it forks a script, the script writes one
# line and exits, and between samples this holds zero bytes.
#
# The alternative, node_exporter, is ~20 MB resident - which is 0.016% of 121
# GB and genuinely not the problem people think it is. What rules it out here
# is that it is a LISTENER whose data exists only while something external
# scrapes it. This keeps recording with your laptop shut.
# ---------------------------------------------------------------------------
# The cluster-wide view. Same bargain as the other two: it forks a collector per
# node, renders a frame and sleeps, so nothing is resident between refreshes.
#
# /usr/local/bin rather than ~/.local/bin beside gx10-status, for the same
# reason gx10-interconnect lives there: it is invoked over SSH by its own
# collector fan-out and by anything scripting it, and a non-login shell never
# gets ~/.local/bin on PATH.
#
# It ships its own collector to each node over stdin instead of relying on a
# copy being installed remotely, so a node running an older provision cannot
# feed the renderer a payload it does not understand.
- name: Install the cluster-wide top
  ansible.builtin.copy:
    src: gx10-top
    dest: /usr/local/bin/gx10-top
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Install the history sampler
  ansible.builtin.copy:
    src: gx10-sample
    dest: /usr/local/bin/gx10-sample
    owner: root
    group: root
    mode: "0755"
  become: true
  when: monitoring_history | bool

- name: Ensure the sample directory exists
  ansible.builtin.file:
    path: "{{ monitoring_history_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  when: monitoring_history | bool

# AccuracySec is load-bearing at sub-minute intervals: systemd's default is
# 1 min, so it would happily coalesce a 10 s timer into one firing a minute and
# the history would silently be six times coarser than configured.
- name: Install the sampler service and timer
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.name }}"
    mode: "0644"
    content: "{{ item.content }}"
  become: true
  loop:
    - name: gx10-sample.service
      content: |
        # Managed by gx10-cluster ansible (roles/monitoring).
        [Unit]
        Description=Append one GX10 health sample

        [Service]
        Type=oneshot
        Environment=GX10_SAMPLE_OUT={{ monitoring_history_dir }}/metrics.csv
        ExecStart=/usr/local/bin/gx10-sample
    - name: gx10-sample.timer
      content: |
        # Managed by gx10-cluster ansible (roles/monitoring).
        [Unit]
        Description=Sample GX10 health every {{ monitoring_history_interval }}

        [Timer]
        OnBootSec=1min
        OnUnitActiveSec={{ monitoring_history_interval }}
        AccuracySec=1s

        [Install]
        WantedBy=timers.target
  loop_control:
    label: "{{ item.name }}"
  notify: Restart the sampler timer
  when: monitoring_history | bool

- name: Enable the sampler timer
  ansible.builtin.systemd:
    name: gx10-sample.timer
    enabled: true
    state: started
    daemon_reload: true
  become: true
  when:
    - monitoring_history | bool
    # Under --check the unit file above was never actually written, so systemd
    # cannot find it and this fails - on a node that is perfectly healthy.
    # `make diff` has to report what WOULD change, not fall over on the
    # consequences of its own dry-ness. Same shape as the models role's disk
    # guard.
    - not ansible_check_mode

# ~1 MB/day at 10 s. Rotation is what keeps "cheap" true over months.
# `create`, not `copytruncate`: the sampler opens the file per invocation and
# closes it again, so there is no long-lived descriptor to keep valid, and
# copytruncate has a window where a concurrent append is lost.
- name: Rotate the sample log
  ansible.builtin.copy:
    dest: /etc/logrotate.d/gx10-sample
    mode: "0644"
    content: |
      # Managed by gx10-cluster ansible (roles/monitoring).
      {{ monitoring_history_dir }}/metrics.csv {
          weekly
          rotate {{ monitoring_history_keep_weeks }}
          compress
          missingok
          notifempty
          create 0644 root root
      }
  become: true
  when: monitoring_history | bool

- name: Explain
  ansible.builtin.debug:
    msg: >-
      `gx10-status` shows GPU, throttling, unified memory, swap and disk with
      no daemon. `gx10-status -w` watches.
      `gx10-storage` says where the disk went and what is safe to reclaim;
      `gx10-storage --reclaim` shows the plan without running it.
      {{ '`gx10-sample -r` shows recorded history from '
         ~ monitoring_history_dir ~ '/metrics.csv (sampled every '
         ~ monitoring_history_interval ~ ', no resident cost).'
         if monitoring_history | bool else '' }}
      For a scrapeable metrics endpoint or dashboards, see
      docs/runbooks/monitoring.md
