---
- name: Install openssh-server
  ansible.builtin.apt:
    name: openssh-server
    state: present
  become: true

# Ubuntu 24.04 socket-activates sshd. ListenStream=0.0.0.0:22 is baked into
# ssh.socket, and `Port` in sshd_config is ignored - so a non-22 value here
# produces a config that looks applied while sshd still answers on 22. If you
# then narrow ufw to the new port you are locked out of a live listener.
- name: Assert ssh_port is compatible with socket activation
  ansible.builtin.assert:
    that: ssh_port | int == 22
    fail_msg: >-
      ssh_port is {{ ssh_port }}, but this host socket-activates sshd and
      ssh.socket hardcodes port 22. Changing the port requires an ssh.socket
      drop-in (ListenStream=), not sshd_config. Refusing to write a config
      that would silently not apply.

- name: Secure the .ssh directory
  ansible.builtin.file:
    path: "{{ primary_home }}/.ssh"
    state: directory
    owner: "{{ primary_user }}"
    group: "{{ primary_user }}"
    mode: "0700"
  become: true

# This is not cosmetic. OpenSSH's StrictModes (on by default) refuses any
# authorized_keys with group or other write bits - it silently ignores every
# key in the file. This box shipped with mode 0664, which is why its journal
# shows only "Accepted password" and never "Accepted publickey".
- name: Enforce authorized_keys permissions
  ansible.builtin.file:
    path: "{{ primary_home }}/.ssh/authorized_keys"
    state: file
    owner: "{{ primary_user }}"
    group: "{{ primary_user }}"
    mode: "0600"
  become: true
  failed_when: false   # absent is fine; the next task creates it

- name: Install authorized keys
  ansible.posix.authorized_key:
    user: "{{ primary_user }}"
    key: "{{ item }}"
    state: present
  become: true
  loop: "{{ authorized_keys }}"

# ---------------------------------------------------------------------------
# Disabling password auth is an EXPLICIT, deliberate act - never inferred.
#
# An earlier version probed `ssh -o PreferredAuthentications=publickey
# user@localhost`. That was wrong in both directions. It cannot test the key
# that matters, because its private half is on your laptop, not on the node:
#   - false negative: the probe fails even when your key works fine, so the
#     hardening never applies and the setting is decorative;
#   - false positive: ANY locally-reachable key passes it - an agent key, a
#     shared key, the node's own inter-node key - and passwords get disabled
#     on the strength of a credential you do not hold.
# It also inherited the invoking shell's SSH_AUTH_SOCK, so `make apply` over
# `ssh -A` and the same command at the console produced DIFFERENT sshd configs.
#
# There is no way to prove from here that you can get back in. So we do not
# pretend: you assert it, having checked, and the assert below makes the
# unsafe combination impossible.
# ---------------------------------------------------------------------------
- name: Refuse to disable password auth without a declared key
  ansible.builtin.assert:
    that: authorized_keys | length > 0
    fail_msg: >-
      ssh_disable_passwords is true but authorized_keys is empty. That
      combination is an unrecoverable lockout. Declare your public key in
      group_vars/all.yml first.
  when: ssh_disable_passwords | bool

- name: Record the password-auth decision
  ansible.builtin.set_fact:
    safe_to_disable_passwords: "{{ ssh_disable_passwords | bool }}"

- name: Explain that password auth is staying on
  ansible.builtin.debug:
    msg: >-
      Password authentication stays ENABLED ({{ authorized_keys | length }}
      key(s) declared). To turn it off: verify from ANOTHER terminal that
      `ssh -o PreferredAuthentications=publickey {{ primary_user }}@{{ ansible_hostname }}`
      works, then set ssh_disable_passwords: true and re-run --tags remote.
      Keep that terminal open while you do.
  when: not (safe_to_disable_passwords | bool)

- name: Harden sshd
  ansible.builtin.template:
    src: 10-gx10.conf.j2
    dest: /etc/ssh/sshd_config.d/10-gx10.conf
    mode: "0644"
    validate: "/usr/sbin/sshd -t -f %s"
  become: true
  notify: Restart ssh

# Apply the sshd change NOW rather than at end of play. If a later role fails,
# an unflushed handler leaves the new config sitting on disk, unapplied, to
# detonate at the next reboot with nothing connecting it to this run. An
# immediate failure is strictly better than a delayed one.
#
# Note this flushes ALL pending handlers, not only Restart ssh - a docker
# restart notified earlier will also fire here.
- name: Apply sshd configuration immediately
  ansible.builtin.meta: flush_handlers

- name: Verify the merged sshd config is valid
  ansible.builtin.command: /usr/sbin/sshd -t
  become: true
  changed_when: false

- name: Enable ssh socket activation
  ansible.builtin.systemd:
    name: ssh.socket
    enabled: true
    state: started
  become: true

# --- Firewall --------------------------------------------------------------
- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present
  become: true
  when: enable_ufw | bool

# Allow rules first, THEN enable. The reverse order locks out the operator.
- name: Allow SSH from trusted sources
  community.general.ufw:
    rule: allow
    port: "{{ ssh_port }}"
    proto: tcp
    src: "{{ item }}"
    comment: "ssh from {{ item }}"
  become: true
  loop: "{{ ufw_ssh_sources }}"
  when: enable_ufw | bool

# Tailscale is the out-of-LAN access path, so allow it by interface rather
# than relying on its CGNAT range surviving a rule reshuffle.
- name: Allow all traffic on the tailscale interface
  community.general.ufw:
    rule: allow
    interface: tailscale0
    direction: in
    comment: "tailscale"
  become: true
  when:
    - enable_ufw | bool
    - install_tailscale | bool

- name: Allow traffic on the cluster interconnect subnets
  community.general.ufw:
    rule: allow
    src: "{{ item }}.0/{{ cluster_subnet_prefix }}"
    comment: "gx10 interconnect"
  become: true
  loop: "{{ cluster_subnets }}"
  when: enable_ufw | bool

- name: Enable ufw with default deny incoming
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming
  become: true
  when: enable_ufw | bool

# --- Tailscale -------------------------------------------------------------
# Installed from the apt repo rather than `curl | sh` as root - the script
# only adds this repo and key, and doing it directly gives a signed,
# apt-managed, pinnable package instead of piping a live URL into root's shell.
- name: Add the tailscale apt key
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_distribution_release }}.noarmor.gpg"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: "0644"
  become: true
  when: install_tailscale | bool

- name: Add the tailscale apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg]
      https://pkgs.tailscale.com/stable/ubuntu {{ ansible_distribution_release }} main
    filename: tailscale
    state: present
  become: true
  when: install_tailscale | bool

- name: Install tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true
  become: true
  when: install_tailscale | bool

- name: Enable tailscaled
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started
  become: true
  when: install_tailscale | bool
