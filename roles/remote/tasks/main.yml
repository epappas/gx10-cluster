---
- name: Install openssh-server
  ansible.builtin.apt:
    name: openssh-server
    state: present
  become: true

# Ubuntu 24.04 socket-activates sshd. ListenStream=0.0.0.0:22 is baked into
# ssh.socket, and `Port` in sshd_config is ignored - so a non-22 value here
# produces a config that looks applied while sshd still answers on 22. If you
# then narrow ufw to the new port you are locked out of a live listener.
- name: Assert ssh_port is compatible with socket activation
  ansible.builtin.assert:
    that: ssh_port | int == 22
    fail_msg: >-
      ssh_port is {{ ssh_port }}, but this host socket-activates sshd and
      ssh.socket hardcodes port 22. Changing the port requires an ssh.socket
      drop-in (ListenStream=), not sshd_config. Refusing to write a config
      that would silently not apply.

- name: Secure the .ssh directory
  ansible.builtin.file:
    path: "{{ primary_home }}/.ssh"
    state: directory
    owner: "{{ primary_user }}"
    group: "{{ primary_user }}"
    mode: "0700"
  become: true

# Hygiene - and deliberately no longer claiming to be more than that.
#
# The comment here used to assert this was fixing a live fault: that OpenSSH
# StrictModes was ignoring every key because the file shipped at 0664, "which
# is why its journal shows only Accepted password". That is measurably false on
# this hardware. Both nodes have authorized_keys at 0664 right now, the journal
# shows "Accepted publickey", and an explicit
# `-o PreferredAuthentications=publickey` login succeeds. Whatever the precise
# StrictModes rule is, 0664 owned by a user-private group is not tripping it.
#
# Tighten it anyway: 0600/0700 is what every piece of SSH documentation assumes,
# the tolerance above is not a property to depend on, and if it ever stops
# applying the failure is silent - every key in the file ignored, no error
# logged, and you are back to passwords without being told.
- name: Enforce authorized_keys permissions
  ansible.builtin.file:
    path: "{{ primary_home }}/.ssh/authorized_keys"
    state: file
    owner: "{{ primary_user }}"
    group: "{{ primary_user }}"
    mode: "0600"
  become: true
  failed_when: false   # absent is fine; the next task creates it

- name: Install authorized keys
  ansible.posix.authorized_key:
    user: "{{ primary_user }}"
    key: "{{ item }}"
    state: present
  become: true
  loop: "{{ authorized_keys }}"

# ---------------------------------------------------------------------------
# Disabling password auth is an EXPLICIT, deliberate act - never inferred.
#
# An earlier version probed `ssh -o PreferredAuthentications=publickey
# user@localhost`. That was wrong in both directions. It cannot test the key
# that matters, because its private half is on your laptop, not on the node:
#   - false negative: the probe fails even when your key works fine, so the
#     hardening never applies and the setting is decorative;
#   - false positive: ANY locally-reachable key passes it - an agent key, a
#     shared key, the node's own inter-node key - and passwords get disabled
#     on the strength of a credential you do not hold.
# It also inherited the invoking shell's SSH_AUTH_SOCK, so `make apply` over
# `ssh -A` and the same command at the console produced DIFFERENT sshd configs.
#
# There is no way to prove from here that you can get back in. So we do not
# pretend: you assert it, having checked, and the assert below makes the
# unsafe combination impossible.
# ---------------------------------------------------------------------------
- name: Refuse to disable password auth without a declared key
  ansible.builtin.assert:
    that: authorized_keys | length > 0
    fail_msg: >-
      ssh_disable_passwords is true but authorized_keys is empty. That
      combination is an unrecoverable lockout. Declare your public key in
      group_vars/all.yml first.
  when: ssh_disable_passwords | bool

- name: Record the password-auth decision
  ansible.builtin.set_fact:
    safe_to_disable_passwords: "{{ ssh_disable_passwords | bool }}"

- name: Explain that password auth is staying on
  ansible.builtin.debug:
    msg: >-
      Password authentication stays ENABLED ({{ authorized_keys | length }}
      key(s) declared). To turn it off: verify from ANOTHER terminal that
      `ssh -o PreferredAuthentications=publickey {{ primary_user }}@{{ ansible_facts['hostname'] }}`
      works, then set ssh_disable_passwords: true and re-run --tags remote.
      Keep that terminal open while you do.
  when: not (safe_to_disable_passwords | bool)

- name: Harden sshd
  ansible.builtin.template:
    src: 10-gx10.conf.j2
    dest: /etc/ssh/sshd_config.d/10-gx10.conf
    mode: "0644"
    validate: "/usr/sbin/sshd -t -f %s"
  become: true
  notify: Restart ssh

# Apply the sshd change NOW rather than at end of play. If a later role fails,
# an unflushed handler leaves the new config sitting on disk, unapplied, to
# detonate at the next reboot with nothing connecting it to this run. An
# immediate failure is strictly better than a delayed one.
#
# Note this flushes ALL pending handlers, not only Restart ssh - a docker
# restart notified earlier will also fire here.
- name: Apply sshd configuration immediately
  ansible.builtin.meta: flush_handlers

- name: Verify the merged sshd config is valid
  ansible.builtin.command: /usr/sbin/sshd -t
  become: true
  changed_when: false

- name: Enable ssh socket activation
  ansible.builtin.systemd:
    name: ssh.socket
    enabled: true
    state: started
  become: true

# --- Firewall --------------------------------------------------------------
- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present
  become: true
  when: enable_ufw | bool

# Allow rules first, THEN enable. The reverse order locks out the operator.
- name: Allow SSH from trusted sources
  community.general.ufw:
    rule: allow
    port: "{{ ssh_port }}"
    proto: tcp
    src: "{{ item }}"
    comment: "ssh from {{ item }}"
  become: true
  loop: "{{ ufw_ssh_sources }}"
  when: enable_ufw | bool

# The mesh VPN is the out-of-LAN access path, so allow it by INTERFACE rather
# than by its address range. Both NordVPN Meshnet and Tailscale hand out
# 100.64.0.0/10, which is shared CGNAT space and not something to grant blanket
# trust to by CIDR - the interface is the precise statement of "traffic that
# arrived through the mesh".
- name: Allow all traffic on the mesh VPN interface
  community.general.ufw:
    rule: allow
    interface: "{{ nordvpn_iface }}"
    direction: in
    comment: "nordvpn meshnet"
  become: true
  when:
    - enable_ufw | bool
    - install_nordvpn | bool

- name: Allow traffic on the cluster interconnect subnets
  community.general.ufw:
    rule: allow
    src: "{{ item }}.0/{{ cluster_subnet_prefix }}"
    comment: "gx10 interconnect"
  become: true
  loop: "{{ cluster_subnets }}"
  when: enable_ufw | bool

# ---------------------------------------------------------------------------
# The other nodes, on the MANAGEMENT path. This rule is load-bearing, not
# belt-and-braces.
#
# NCCL_SOCKET_IFNAME points at the management NIC by design (see decisions.md),
# and NCCL's bootstrap listener on rank 0 binds an EPHEMERAL port there - so
# there is no port-scoped rule that can describe it. With only `allow 22/tcp`
# from the LAN plus a default deny, the peer's bootstrap connection is silently
# dropped and every collective hangs at init. That is indistinguishable from a
# broken interconnect and gets debugged as one, for hours, on the fabric you
# just cabled correctly. torchrun's rendezvous and Ray's ports sit in exactly
# the same position.
#
# Scoped to the peers' own addresses, not the whole LAN.
# ---------------------------------------------------------------------------
- name: Allow all traffic from the other cluster nodes
  community.general.ufw:
    rule: allow
    src: "{{ item }}"
    comment: "gx10 peer node"
  become: true
  loop: "{{ cluster_peer_mgmt_addrs }}"
  when: enable_ufw | bool

- name: Enable ufw with default deny incoming
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming
  become: true
  when: enable_ufw | bool

# --- Mesh VPN --------------------------------------------------------------
# NordVPN Meshnet, not Tailscale. Its own file: this role was already long, and
# the mesh client has enough platform-specific behaviour (group handling, a
# kill-switch unit, its own packet filter) to be worth reading in one piece.
- name: Configure the mesh VPN
  ansible.builtin.include_tasks: nordvpn.yml
  when: install_nordvpn | bool
