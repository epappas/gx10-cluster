---
# ===========================================================================
# NordVPN Meshnet - the out-of-LAN access path.
#
# MESHNET ONLY. This box never calls `nordvpn connect`: it is not a VPN client
# needing an exit node, it is a compute node you need to reach. Meshnet is
# peer-to-peer WireGuard (libtelio) between your own devices and needs no
# tunnel to a NordVPN server.
#
# Installed from NordVPN's own apt repo rather than their install script, for
# the same reason as gh in roles/base: signed, apt-managed, pinnable, and no
# piping a live URL into root's shell.
#
# Everything below runs as root rather than as the primary user. The CLI talks
# to /run/nordvpn/nordvpnd.sock, which is root:nordvpn 0660 - the primary user
# is added to that group here, but a group added mid-play is not in the current
# session, so a become_user run would fail with "Permission denied accessing
# /run/nordvpn/nordvpnd.sock". Login state lives in the daemon, not per-user,
# so root doing it is the same as anyone doing it.
# ===========================================================================

- name: Add the NordVPN apt key
  ansible.builtin.get_url:
    url: https://repo.nordvpn.com/gpg/nordvpn_public.asc
    dest: /usr/share/keyrings/nordvpn-archive-keyring.asc
    mode: "0644"
    # apt has taken ASCII-armored keys via signed-by since 2.4, so no dearmor
    # step. The checksum is deliberate: a mismatch means the signing key
    # changed, which is not automatically an attack but is not something to
    # accept silently either. Verify the new key against NordVPN's published
    # fingerprint - the current one is rsa4096, created 2018-08-02,
    # BC54 80EF EC5C 081C E5BC  FBE2 6B21 9E53 5C96 4CA1 - before bumping this.
    checksum: "sha256:cc9bff9344b005df90f5a13a18a9729ebacb078052c60742bdf85803efc2f940"
  become: true

# Note the suite is literally `stable`, not the distro codename - NordVPN
# publishes one distro-agnostic suite, unlike tailscale's per-release ones.
# arm64 is published there; verified against the repo's own Packages index.
- name: Add the NordVPN apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ apt_arch }} signed-by=/usr/share/keyrings/nordvpn-archive-keyring.asc]
      https://repo.nordvpn.com/deb/nordvpn/debian stable main
    filename: nordvpn
    state: present
  become: true

- name: Install the NordVPN client
  ansible.builtin.apt:
    name: nordvpn
    state: present
    update_cache: true
  become: true

# The package's preinst runs `gpasswd -M "" nordvpn` on a FRESH install, which
# empties the group, and then adds exactly one user it guesses from $SUDO_USER,
# else `logname`, else uid 1000. Under Ansible that guess is unreliable - with
# pipelining there is no SUDO_USER and logname fails on a non-tty - and a later
# reinstall silently drops whoever was in there. So set membership ourselves,
# after the package, on every run.
- name: Add the primary user to the nordvpn group
  ansible.builtin.user:
    name: "{{ primary_user }}"
    groups: nordvpn
    append: true
  become: true
  register: nordvpn_group

- name: Note that a re-login is needed for nordvpn group membership
  ansible.builtin.debug:
    msg: >-
      {{ primary_user }} was added to the nordvpn group. Log out and back in
      before `nordvpn` works without sudo.
  when: nordvpn_group.changed

- name: Enable the NordVPN daemon
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  become: true
  loop:
    - nordvpnd.socket
    - nordvpnd.service

# See the reasoning on nordvpn_disable_killswitch in group_vars/all.yml: a kill
# switch for a tunnel this box never establishes protects nothing, and the unit
# manipulates netfilter before the network is up on a host whose inference
# stack is entirely Docker containers.
# masked, not `enabled: false`. The unit is STATIC (verified:
# `systemctl show nordvpnd-killswitch.service -p UnitFileState` -> static), and
# a static unit has no [Install] section, so it can be neither enabled nor
# disabled. Asking systemd to disable it is a no-op that never converges, which
# is why this task reported "changed" on every single run forever. Masking is
# the mechanism that actually prevents a static unit from being pulled in by
# something else's dependency, which is how this one gets started.
- name: Disable the NordVPN kill switch unit
  ansible.builtin.systemd:
    name: nordvpnd-killswitch.service
    masked: true
    state: stopped
  become: true
  when: nordvpn_disable_killswitch | bool

# --- Login -----------------------------------------------------------------
- name: Check whether NordVPN is already logged in
  ansible.builtin.command: nordvpn account
  become: true
  register: nordvpn_account_pre
  changed_when: false
  failed_when: false
  check_mode: false

# Both login-state tests below require rc 0 AND the absence of the "not logged
# in" string, and that is not belt-and-braces.
#
# `nordvpn account` prints "You're not logged in" when it is not, and account
# details when it is - but it also exits non-zero with nothing useful on stdout
# when the daemon socket is unreachable, the CLI is not installed yet, or this
# user is not in the nordvpn group. Testing the string alone gets that case
# backwards, because `'not logged in' not in ""` is TRUE: an absent client
# reads as logged in, and the meshnet commands then run against nothing. Both
# streams are checked because the CLI does not consistently use stdout.
- name: Record whether NordVPN was already logged in
  ansible.builtin.set_fact:
    nordvpn_logged_in: >-
      {{ (nordvpn_account_pre.rc | default(1)) == 0
         and 'not logged in' not in ((nordvpn_account_pre.stdout | default(''))
                                     ~ (nordvpn_account_pre.stderr | default(''))) }}

# MUST come before the login. On a client that has never recorded an analytics
# choice, `nordvpn login` asks for one interactively:
#
#   Do you allow us to collect and use limited app performance data? (y/n)
#
# Under ansible there is no interactive stdin, so the read returns nothing, the
# CLI answers itself "Invalid response. Please answer with yes/no.", and asks
# again - forever, at full speed. Observed: 224 MB of prompt text written to
# the stdout pipe in four minutes, every byte of it buffered in the ansible
# module's memory, with the run wedged on a task that can never complete.
#
# Setting the choice explicitly first is what stops the prompt being asked at
# all. It works while logged OUT, which is the only reason this ordering is
# possible. It is also a privacy decision, so it is a variable rather than a
# hardcoded flag - see nordvpn_analytics in group_vars/all.yml.
- name: Record the analytics consent choice
  ansible.builtin.command:
    argv: ["nordvpn", "set", "analytics", "{{ 'on' if nordvpn_analytics | bool else 'off' }}"]
  become: true
  register: nordvpn_analytics_set
  # "Analytics is already set to 'disabled'." is the client's own no-op message,
  # same shape as the firewall task below.
  changed_when: "'already set to' not in nordvpn_analytics_set.stdout"

# `--token` is a BOOLEAN flag and the token is a POSITIONAL argument. The
# obvious `--token=<t>` fails with
#   Incorrect Usage: invalid boolean value "<t>" for -token: parse error
# argv form so the token is never handed to a shell.
#
# Wrapped in `timeout` as a backstop, NOT as the fix - the consent task above
# is the fix. This exists so that the next interactive prompt nordvpn decides
# to add fails the run in 60 seconds with a diagnosable rc=124, instead of
# spooling gigabytes into memory until something dies.
#
# Note the CLI exits 0 even when the login FAILS ("We couldn't log you in - the
# access token is not valid" comes back with rc=0), so rc proves nothing here.
# That is why the state is re-read below rather than inferred from this task.
- name: Log in to NordVPN
  ansible.builtin.command:
    argv: ["timeout", "60", "nordvpn", "login", "--token", "{{ nordvpn_token }}"]
  become: true
  no_log: true
  changed_when: true
  when:
    - nordvpn_token | length > 0
    - not (nordvpn_logged_in | bool)

- name: Re-read the NordVPN login state
  ansible.builtin.command: nordvpn account
  become: true
  register: nordvpn_account
  changed_when: false
  failed_when: false
  check_mode: false

# Asks the daemon again rather than inferring from whether the login task ran -
# same rc-and-string test as above, for the same reason.
- name: Record whether NordVPN is usable
  ansible.builtin.set_fact:
    nordvpn_ready: >-
      {{ (nordvpn_account.rc | default(1)) == 0
         and 'not logged in' not in ((nordvpn_account.stdout | default(''))
                                     ~ (nordvpn_account.stderr | default(''))) }}

- name: Explain that NordVPN is installed but not logged in
  ansible.builtin.debug:
    msg: >-
      NordVPN is installed and running but NOT logged in, so Meshnet is off and
      this node is reachable on the LAN only. Generate a token in Nord Account
      -> NordVPN -> Advanced settings -> Get access token, then either set
      nordvpn_token in a vault file and re-run `--tags remote`, or run
      `sudo nordvpn login --token <token>` here. Note that plain
      `nordvpn logout` REVOKES the token - use `--persist-token` if you want to
      reuse it.
  when: not (nordvpn_ready | bool)

# --- Settings, once logged in ----------------------------------------------
# The client ships its own packet filter, separate from Meshnet. ufw is the
# authority on this box and two uncoordinated netfilter writers is already one
# too many with Docker in the picture. This does NOT remove NordVPN's fwmark
# rules from the mangle table - those are policy routing and have no CLI
# switch - so nordvpn remains a partial third writer regardless.
- name: Turn off NordVPN's own firewall
  ansible.builtin.command: nordvpn set firewall off
  become: true
  register: nordvpn_fw
  # "<setting> is already set to '<value>'." is the client's own no-op message.
  changed_when: "'already set to' not in nordvpn_fw.stdout"
  when:
    - nordvpn_ready | bool
    - nordvpn_disable_firewall | bool

# rc from this command is unreliable in BOTH directions, so it decides nothing:
#
#   - "Meshnet is already enabled." exits rc=1. That is the no-op case, and
#     without the failed_when below it made a second `--tags remote` run fail
#     on an already-working node.
#   - "maximum device count reached" has been seen exiting rc=0. The account
#     caps Meshnet at 10 devices; the 11th is refused, the CLI reports the
#     misleading "We're having trouble reaching our servers", and the run
#     carries on as though it worked.
#
# So: treat the no-op text as success, and confirm the actual state afterwards
# rather than believing either the exit code or the message.
- name: Enable Meshnet
  ansible.builtin.command: nordvpn set meshnet on
  become: true
  register: nordvpn_mesh
  # Changed only when it actually turned Meshnet ON. rc=0 does not mean that
  # (see above), and neither does "not already enabled" on its own - on a node
  # the account has no room for, stdout is an error and every run would report
  # a change that never happened.
  changed_when:
    - nordvpn_mesh.rc == 0
    - "'already enabled' not in nordvpn_mesh.stdout"
  # Never fatal, and the state read-back below is what makes that safe. A node
  # that cannot join Meshnet is LAN-only, which the README already describes as
  # a legitimate state - the same reasoning that makes the cable-dependent
  # checks in verify.yml reported rather than fatal. Failing here instead means
  # one full account blocks `--tags remote` on BOTH boxes, because site.yml is
  # any_errors_fatal with serial: 1: poseidon's account limit would abort a run
  # that had nothing to do with it.
  failed_when: false
  when: nordvpn_ready | bool

- name: Read back whether Meshnet is actually on
  ansible.builtin.command: nordvpn settings
  become: true
  register: nordvpn_settings
  changed_when: false
  failed_when: false
  check_mode: false
  when: nordvpn_ready | bool

- name: Record the Meshnet state
  ansible.builtin.set_fact:
    nordvpn_mesh_on: >-
      {{ 'meshnet: enabled' in (nordvpn_settings.stdout | default('') | lower) }}
  when: nordvpn_ready | bool

# Reported, not fatal - an unregistered node is still a healthy node, in the
# same way an uncabled one is. But it is reported LOUDLY, because the CLI's own
# message points at the network and the real cause is an account limit.
- name: Explain that Meshnet did not come up
  ansible.builtin.debug:
    msg: >-
      Meshnet is still OFF on {{ inventory_hostname }} despite a successful
      login. The usual cause is the account's 10-device Meshnet cap, which the
      CLI misreports as "We're having trouble reaching our servers" - check
      `sudo journalctl -u nordvpnd | grep "maximum device count"`. Free a slot
      in Nord Account -> Meshnet, or with
      `nordvpn meshnet peer remove <hostname>`, then re-run.
  when:
    - nordvpn_ready | bool
    - not (nordvpn_mesh_on | default(false) | bool)

# Nord assigns every device a random two-word name (epappas-atlas.nord,
# epappas-himalayas.nord), which tells you nothing about which machine it is -
# on an account with ten devices, three of them Linux, that is a guessing game
# every time you want to ssh somewhere. The nickname is addressable as
# `<nickname>.nord` alongside the generated name, so this makes the cluster
# reachable by the same identity it uses everywhere else in this repo.
#
# Derived from inventory_hostname, like node_hostname and the Slurm NodeName,
# so renaming a box in inventory.yml renames it here too. The gx10- prefix is
# because the Meshnet namespace is the whole ACCOUNT, not this cluster: bare
# `odysseus` would collide with any other machine you ever name that.
#
# Requires Meshnet to be ON, so it must come after the task above. A device
# that failed to register (the account's 10-device cap is a real ceiling) has
# nothing to name, hence the failed_when: false rather than a hard error.
- name: Set this node's Meshnet nickname
  ansible.builtin.command: nordvpn meshnet set nickname {{ nordvpn_nickname }}
  become: true
  register: nordvpn_nick
  changed_when: "'is now set to' in nordvpn_nick.stdout"
  failed_when: false
  when:
    - nordvpn_ready | bool
    - nordvpn_mesh_on | default(false) | bool
    - nordvpn_nickname | length > 0

# Meshnet treats 172.17.0.0/16 as a local network and drops peer traffic aimed
# at it, so without this a peer cannot reach anything in a container on this
# box - which includes vLLM. Documented behaviour, not a workaround.
#
# PER PEER. This was `nordvpn meshnet peer local allow all`, which answers
# "Peer 'all' is unknown." - there is no `all` keyword, so the task had never
# once done what it says, and `failed_when: false` hid that while it reported
# "changed" on every run forever.
#
# The peer set comes from INVENTORY, not from parsing `peer list`. Two reasons:
# the output has no stable machine format, and more importantly this grants
# local-network access, so it should reach the cluster's own nodes and nothing
# else by default. The Meshnet namespace is the whole account - phones, laptops,
# other people's machines if you have ever accepted an invite - and "allow
# everything on the account into this box's docker networks" is not a default
# worth having. Add anything else deliberately via nordvpn_local_allow_extra.
#
# Addressed by nickname, because the generated hostname is recycled between
# devices (see the ssh config note in roles/cluster).
- name: Allow cluster peers to reach local (docker) networks
  ansible.builtin.command: nordvpn meshnet peer local allow {{ item }}
  become: true
  register: nordvpn_local
  # "... is already allowed." is the client's own no-op message.
  changed_when: "'already allowed' not in nordvpn_local.stdout"
  # A peer that is not registered yet is not an error - the other node may not
  # have joined, and this run is what would tell you so.
  failed_when: false
  loop: "{{ nordvpn_local_peers }}"
  when:
    - nordvpn_ready | bool
    - nordvpn_mesh_on | default(false) | bool

- name: Report the Meshnet address
  ansible.builtin.shell:
    cmd: "set -o pipefail; ip -4 -br addr show {{ nordvpn_iface }} 2>/dev/null | awk '{print $3}'"
    executable: /bin/bash
  register: nordvpn_addr
  changed_when: false
  failed_when: false
  when: nordvpn_ready | bool

- name: Show the Meshnet address
  ansible.builtin.debug:
    msg: >-
      Meshnet up on {{ nordvpn_iface }}
      {{ nordvpn_addr.stdout | default('(no address yet)') | trim }}.
      Peers: `nordvpn meshnet peer list`.
  when: nordvpn_ready | bool
