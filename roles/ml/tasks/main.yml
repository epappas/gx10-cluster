---
# ---------------------------------------------------------------------------
# CUDA libraries. The CUDA compute repo is configured by DGX OS.
# NCCL is the transport for multi-node collectives over the ConnectX-7.
# ---------------------------------------------------------------------------
- name: Install NCCL and cuDNN
  ansible.builtin.apt:
    name:
      - libnccl2
      - libnccl-dev
      - "cudnn9-cuda-{{ cuda_major }}"
    state: present
  become: true

# ---------------------------------------------------------------------------
# The shared ML virtualenv
# ---------------------------------------------------------------------------
- name: Create the venv parent directory
  ansible.builtin.file:
    path: "{{ ml_venv | dirname }}"
    state: directory
    owner: "{{ primary_user }}"
    group: "{{ primary_user }}"
    mode: "0755"
  become: true

- name: Create the ML virtualenv
  ansible.builtin.command: "{{ uv_bin }} venv --python {{ ml_python }} {{ ml_venv }}"
  args:
    creates: "{{ ml_venv }}/bin/python"
  become_user: "{{ primary_user }}"
  become: true

# torch must come from the cu130 index: it is the only one publishing aarch64
# wheels with sm_121 kernels. Installing from PyPI gives you a wheel that
# imports fine and then fails at the first kernel launch with
# "no kernel image is available for execution on the device".
- name: Install PyTorch aarch64 wheels for CUDA {{ cuda_major }}
  ansible.builtin.command: >-
    {{ uv_bin }} pip install
    --python {{ ml_venv }}/bin/python
    --index-url {{ torch_index_url }}
    torch=={{ torch_version }} torchvision
  become_user: "{{ primary_user }}"
  become: true
  register: torch_install
  changed_when: "'Installed' in (torch_install.stderr | default(''))"

# Also from the cu130 index. Several of these (peft, trl, bitsandbytes) depend
# on torch, and resolving them against PyPI would try to pull the non-CUDA
# build over the one just installed.
- name: Install the rest of the ML stack
  ansible.builtin.command: >-
    {{ uv_bin }} pip install
    --python {{ ml_venv }}/bin/python
    --index-url {{ torch_index_url }}
    --extra-index-url https://pypi.org/simple
    {{ ml_packages | join(' ') }}
  become_user: "{{ primary_user }}"
  become: true
  register: ml_install
  changed_when: "'Installed' in (ml_install.stderr | default(''))"

- name: Verify PyTorch sees the GB10
  ansible.builtin.command: >-
    {{ ml_venv }}/bin/python -c
    "import torch;
    assert torch.cuda.is_available(), 'CUDA not available to torch';
    cc = torch.cuda.get_device_capability(0);
    assert f'{cc[0]}.{cc[1]}' == '{{ gpu_arch_list }}', f'expected sm_{{ gpu_arch_list }}, got {cc}';
    x = torch.randn(2048, 2048, device='cuda');
    torch.cuda.synchronize();
    print(torch.__version__, torch.cuda.get_device_name(0), cc)"
  become_user: "{{ primary_user }}"
  become: true
  register: torch_check
  changed_when: false

- name: Report the PyTorch check
  ansible.builtin.debug:
    msg: "torch: {{ torch_check.stdout }}"

# ---------------------------------------------------------------------------
# Ollama
# ---------------------------------------------------------------------------
- name: Install ollama
  ansible.builtin.shell:
    cmd: set -o pipefail && curl -fsSL https://ollama.com/install.sh | sh
    executable: /bin/bash
    creates: /usr/local/bin/ollama
  become: true
  when: install_ollama | bool

- name: Ensure the ollama override directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/ollama.service.d
    state: directory
    mode: "0755"
  become: true
  when: install_ollama | bool

- name: Configure ollama
  ansible.builtin.copy:
    dest: /etc/systemd/system/ollama.service.d/override.conf
    mode: "0644"
    content: |
      # Managed by gx10-cluster ansible.
      [Service]
      Environment="OLLAMA_HOST={{ ollama_host }}"
      Environment="OLLAMA_KEEP_ALIVE=30m"
      # Deliberately 1. On unified memory nvidia-smi reports no framebuffer,
      # so ollama's size estimation works against a pool the OS and page
      # cache also live in. Two large models resident is how you reach the
      # swap cliff. Raise only after measuring.
      Environment="OLLAMA_MAX_LOADED_MODELS=1"
      Environment="OLLAMA_FLASH_ATTENTION=1"
  become: true
  when: install_ollama | bool
  notify: Restart ollama

# ---------------------------------------------------------------------------
# llama.cpp, built for sm_121
# ---------------------------------------------------------------------------
- name: Clone llama.cpp
  ansible.builtin.git:
    repo: https://github.com/ggml-org/llama.cpp.git
    dest: "{{ primary_home }}/src/llama.cpp"
    version: "{{ llama_cpp_version }}"
    depth: 1
  become_user: "{{ primary_user }}"
  become: true
  when: build_llama_cpp | bool

# CMAKE_CUDA_ARCHITECTURES=121 is correct as written: llama.cpp's own
# CMakeLists rewrites 12X to 12Xa, because Blackwell's FP4 tensor core
# instructions are not forward-compatible. No need to spell 121a here.
- name: Build llama.cpp with CUDA
  ansible.builtin.shell:
    cmd: |
      set -e
      cmake -B build -DGGML_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=121 \
            -DGGML_CUDA_FA_ALL_QUANTS=ON -DGGML_NATIVE=ON \
            -DCMAKE_BUILD_TYPE=Release
      cmake --build build --config Release -j{{ ansible_processor_vcpus | default(20) }}
    chdir: "{{ primary_home }}/src/llama.cpp"
    creates: "{{ primary_home }}/src/llama.cpp/build/bin/llama-cli"
  become_user: "{{ primary_user }}"
  become: true
  environment:
    PATH: "{{ cuda_home }}/bin:{{ ansible_env.PATH }}"
    CUDA_HOME: "{{ cuda_home }}"
  when: build_llama_cpp | bool
  async: 3600
  poll: 30

- name: Link llama.cpp binaries onto PATH
  ansible.builtin.file:
    src: "{{ primary_home }}/src/llama.cpp/build/bin/{{ item }}"
    dest: "{{ primary_home }}/.local/bin/{{ item }}"
    state: link
    force: true
  become_user: "{{ primary_user }}"
  become: true
  loop: [llama-cli, llama-server, llama-bench, llama-quantize]
  when: build_llama_cpp | bool
