---
# ---------------------------------------------------------------------------
# CUDA libraries. The CUDA compute repo is configured by DGX OS.
# NCCL is the transport for multi-node collectives over the ConnectX-7.
# ---------------------------------------------------------------------------
- name: Install NCCL and cuDNN
  ansible.builtin.apt:
    name:
      - libnccl2
      - libnccl-dev
      - "cudnn9-cuda-{{ cuda_major }}"
    state: present
  become: true

# ---------------------------------------------------------------------------
# The shared ML virtualenv
# ---------------------------------------------------------------------------
- name: Create the venv parent directory
  ansible.builtin.file:
    path: "{{ ml_venv | dirname }}"
    state: directory
    owner: "{{ primary_user }}"
    group: "{{ primary_user }}"
    mode: "0755"
  become: true

- name: Create the ML virtualenv
  ansible.builtin.command: "{{ uv_bin }} venv --python {{ ml_python }} {{ ml_venv }}"
  args:
    creates: "{{ ml_venv }}/bin/python"
  become_user: "{{ primary_user }}"
  become: true

# The lockfile, not a package list. Everything the venv gets - torch included -
# is resolved once by `make lock` on real aarch64 hardware and committed, so a
# node provisioned today and a node provisioned in six months get byte-identical
# versions. It lives inside the venv because that is exactly what it describes,
# and it goes away with it.
- name: Install the ML lockfile
  ansible.builtin.copy:
    src: requirements-ml.txt
    dest: "{{ ml_venv }}/requirements-ml.txt"
    owner: "{{ primary_user }}"
    group: "{{ primary_user }}"
    mode: "0644"
  become: true

# `pip install -r`, deliberately NOT `pip sync`. The optional Ray role installs
# into this same venv, and sync's whole job is to make the environment match the
# file exactly - it would uninstall ray on the next `make apply`, silently, on a
# run nobody was watching.
#
# --index-strategy is on the command line because uv accepts it nowhere else;
# the two index URLs come from the lockfile itself. requirements-ml.in explains
# why both are needed - the short version is that the cu130 index shadows PyPI
# for torch's own dependencies, and without best-match the pinned modern
# certifi/requests/datasets in the lockfile cannot be found at all.
- name: Install the ML stack from the lockfile
  ansible.builtin.command: >-
    {{ uv_bin }} pip install
    --python {{ ml_venv }}/bin/python
    --index-strategy unsafe-best-match
    -r {{ ml_venv }}/requirements-ml.txt
  become_user: "{{ primary_user }}"
  become: true
  register: ml_install
  # uv prints "Installed N packages" on a change and "Audited N packages" on a
  # no-op, both to stderr.
  changed_when: "'Installed' in (ml_install.stderr | default(''))"

- name: Verify PyTorch sees the GB10
  ansible.builtin.command: >-
    {{ ml_venv }}/bin/python -c
    "import torch;
    assert torch.cuda.is_available(), 'CUDA not available to torch';
    cc = torch.cuda.get_device_capability(0);
    assert f'{cc[0]}.{cc[1]}' == '{{ gpu_arch_list }}', f'expected sm_{{ gpu_arch_list }}, got {cc}';
    x = torch.randn(2048, 2048, device='cuda');
    torch.cuda.synchronize();
    print(torch.__version__, torch.cuda.get_device_name(0), cc)"
  become_user: "{{ primary_user }}"
  become: true
  register: torch_check
  changed_when: false
  # Read-only, but it depends on tasks above that --check skips, so it cannot
  # run in check mode at all.
  when: not ansible_check_mode

- name: Report the PyTorch check
  ansible.builtin.debug:
    msg: "torch: {{ torch_check.stdout }}"
  when: not ansible_check_mode

# ---------------------------------------------------------------------------
# Ollama. Its own file - it is a dozen tasks and this one was long enough.
# ---------------------------------------------------------------------------
- name: Install ollama
  ansible.builtin.include_tasks: ollama.yml
  when: install_ollama | bool

# ---------------------------------------------------------------------------
# llama.cpp, built for sm_121
# ---------------------------------------------------------------------------
- name: Clone llama.cpp
  ansible.builtin.git:
    repo: https://github.com/ggml-org/llama.cpp.git
    dest: "{{ primary_home }}/src/llama.cpp"
    version: "{{ llama_cpp_version }}"
    depth: 1
  become_user: "{{ primary_user }}"
  become: true
  when: build_llama_cpp | bool

# CMAKE_CUDA_ARCHITECTURES=121 is correct as written: llama.cpp's own
# CMakeLists rewrites 12X to 12Xa, because Blackwell's FP4 tensor core
# instructions are not forward-compatible. No need to spell 121a here.
- name: Build llama.cpp with CUDA
  ansible.builtin.shell:
    cmd: |
      set -e
      cmake -B build -DGGML_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=121 \
            -DGGML_CUDA_FA_ALL_QUANTS=ON -DGGML_NATIVE=ON \
            -DCMAKE_BUILD_TYPE=Release
      cmake --build build --config Release -j{{ ansible_facts['processor_vcpus'] | default(20) }}
    chdir: "{{ primary_home }}/src/llama.cpp"
    creates: "{{ primary_home }}/src/llama.cpp/build/bin/llama-cli"
  become_user: "{{ primary_user }}"
  become: true
  environment:
    PATH: "{{ cuda_home }}/bin:{{ ansible_facts['env']['PATH'] }}"
    CUDA_HOME: "{{ cuda_home }}"
  when: build_llama_cpp | bool
  async: 3600
  poll: 30

- name: Link llama.cpp binaries onto PATH
  ansible.builtin.file:
    src: "{{ primary_home }}/src/llama.cpp/build/bin/{{ item }}"
    dest: "{{ primary_home }}/.local/bin/{{ item }}"
    state: link
    force: true
  become_user: "{{ primary_user }}"
  become: true
  loop: [llama-cli, llama-server, llama-bench, llama-quantize]
  when: build_llama_cpp | bool
