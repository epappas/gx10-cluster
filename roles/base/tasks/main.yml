---
# ---------------------------------------------------------------------------
# Node identity
# ---------------------------------------------------------------------------
- name: Set the system hostname
  ansible.builtin.hostname:
    name: "{{ node_hostname }}"
  become: true

# The hostname module does NOT touch /etc/hosts, and Ubuntu ships
# `127.0.1.1 <hostname>`. Left alone after a rename that line names a machine
# that no longer exists, and `sudo` spends a DNS timeout on every invocation
# complaining it cannot resolve the host.
#
# It is replaced with the ROUTABLE address rather than repaired in place, and
# that matters more than it looks. torchrun is launched as
# `--master_addr {{ cluster_controller }}`, and on rank 0 that name is resolved
# by rank 0 itself: pointing it at 127.0.1.1 makes the rendezvous socket bind
# loopback, so the peer connects to a port nothing is listening on and the job
# hangs at init with no error. The cluster role's block adds the same mapping,
# but it is appended at EOF - this line comes first in the file, so it is the
# one that wins.
- name: Point this host's name at its routable address in /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s'
    line: "{{ ansible_host }}  {{ node_hostname }}"
    # If Ubuntu's line was already replaced on a previous run there is nothing
    # matching 127.0.1.1 left; put it back near the top rather than at EOF.
    insertafter: '^127\.0\.0\.1\s'
    firstmatch: true
  become: true

# See sudo_passwordless in group_vars/all.yml for why this is on. validate is
# not optional: a malformed file in sudoers.d breaks sudo for EVERY user, and
# on a box with no BMC and root login disabled that is unrecoverable without
# physical access. visudo -cf checks the file before it is put in place.
#
# The filename deliberately has no dot or tilde - sudo silently ignores files
# in sudoers.d whose names contain either.
- name: Grant the primary user passwordless sudo
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/90-gx10-{{ primary_user }}"
    mode: "0440"
    owner: root
    group: root
    content: "{{ primary_user }} ALL=(ALL) NOPASSWD:ALL\n"
    validate: /usr/sbin/visudo -cf %s
  become: true
  when: sudo_passwordless | bool

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  become: true

# ---------------------------------------------------------------------------
# Upgrades are OPT-IN, and the driver stack is held first.
#
# A bare `apt upgrade` on this box wants to install nvidia-modprobe 610.57.04
# against driver 580.173.02 (verified with `apt-get upgrade -s`). That is the
# setuid helper which creates /dev/nvidia*, and it is version-locked to the
# kernel driver. The DGX pin file (cuda-compute-repo-lowpri2) pins nvidia-*580
# and cuda-drivers*, but nvidia-modprobe matches neither glob, and
# `apt-mark showhold` is empty - so nothing stops it.
#
# DGX OS has its own sanctioned upgrade path (nvidia-spark-run-apt-upgrade-once
# and dgx-spark-ota-update-meta) which applies an updated pin first. Prefer it.
# ---------------------------------------------------------------------------
# The holds are applied to the INSTALLED subset of driver_stack_holds, which is
# why the package set is read first. dpkg cannot select a package it has never
# installed and dpkg_selections fails hard when asked to ("Failed to find
# package X"), and not every entry exists on every release - nvidia-dkms-580 is
# absent on this one (verified with dpkg-query).
#
# This replaced `failed_when: false`, which tolerated that case by tolerating
# EVERYTHING: a dpkg lock, a half-configured package or a typo'd name all
# reported ok while the stack silently stayed unheld.
- name: Read the installed package set
  ansible.builtin.package_facts:
    manager: apt

- name: Hold the NVIDIA driver and kernel stack
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  become: true
  loop: "{{ driver_stack_holds | select('in', ansible_facts['packages']) | list }}"

- name: Upgrade packages (opt-in only)
  ansible.builtin.apt:
    upgrade: safe
  become: true
  when: allow_apt_upgrade | bool

- name: Install build toolchain
  ansible.builtin.apt:
    name:
      - build-essential
      - cmake
      - ninja-build
      - pkg-config
      - gdb
      - ccache
      - libssl-dev
      - libffi-dev
      - libcurl4-openssl-dev
      - libomp-dev
    state: present
  become: true

- name: Install CLI utilities
  ansible.builtin.apt:
    name:
      - git
      - git-lfs
      - curl
      - wget
      - rsync
      - unzip
      - jq
      - tree
      - tmux
      - htop
      - ncdu
      - lsof
      - strace
      - ripgrep
      - fzf
      - neovim
      - zsh
      - ethtool
      - iperf3
      - nvme-cli
      - pciutils
      - ca-certificates
    state: present
  become: true

# From GitHub's own repo, not Ubuntu's. Noble ships gh 2.45 (early 2024)
# against upstream's 2.97 - old enough to be missing subcommands you will
# reach for. Same pattern as the NordVPN client in roles/remote: signed,
# apt-managed, pinnable, and no curl-pipe-shell.
- name: Add the GitHub CLI apt key
  ansible.builtin.get_url:
    url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    dest: /usr/share/keyrings/githubcli-archive-keyring.gpg
    mode: "0644"
  become: true

- name: Add the GitHub CLI apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ apt_arch }} signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg]
      https://cli.github.com/packages stable main
    filename: github-cli
    state: present
  become: true

- name: Install the GitHub CLI
  ansible.builtin.apt:
    name: gh
    state: present
    update_cache: true
  become: true

# `git lfs install` prints "Git LFS initialized." whether or not it had
# anything to do, so its output cannot drive changed_when - and with
# --skip-repo it writes no hooks either, only the global filter.lfs.* config.
# That config is the state to test for.
#
# The previous version said it detected the hooks and instead hardcoded
# `changed_when: false`, which is the one bug `make idempotence` structurally
# cannot catch: a changed_when that never fires always looks clean.
- name: Check whether git-lfs is already initialised
  community.general.git_config_info:
    name: filter.lfs.smudge
    scope: global
  become_user: "{{ primary_user }}"
  become: true
  register: lfs_filter

- name: Initialise git-lfs for the primary user
  ansible.builtin.command: git lfs install --skip-repo
  become_user: "{{ primary_user }}"
  become: true
  when: lfs_filter.config_value | length == 0
  changed_when: true

# Identity only. init.defaultBranch and pull.rebase are opinions about this
# repo's machines, not about who you are, so gating them on an email being
# configured silently cost a node both of them.
- name: Configure the git identity
  community.general.git_config:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    scope: global
  become_user: "{{ primary_user }}"
  become: true
  loop:
    - { name: user.name,  value: "{{ git_user_name }}" }
    - { name: user.email, value: "{{ git_user_email }}" }
  when: git_user_email | length > 0

- name: Configure git defaults
  community.general.git_config:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    scope: global
  become_user: "{{ primary_user }}"
  become: true
  loop:
    - { name: init.defaultBranch, value: main }
    - { name: pull.rebase,        value: "true" }

# --- Unattended security updates ------------------------------------------
- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
  become: true

- name: Enable unattended security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
  become: true

# Without this, the nvidia-modprobe skew described above can happen on its own
# schedule - potentially mid-training-run - with nobody having run anything.
- name: Exclude the driver and kernel stack from unattended upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/51gx10-blacklist
    mode: "0644"
    content: |
      // Managed by gx10-cluster ansible.
      Unattended-Upgrade::Package-Blacklist {
      {% for pkg in driver_stack_holds %}
          "{{ pkg }}";
      {% endfor %}
      };
  become: true

# --- Kernel tuning ---------------------------------------------------------
# Deliberately short. Everything here was checked against the live box first;
# DGX OS already sets vm.max_map_count (10-map-count.conf), nofile
# (nv-limits.conf), the CPU governor (nv-cpu-governor) and persistence mode.
# Re-setting those is noise at best and a regression at worst.
- name: Tune sysctl for a unified-memory node
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-gx10.conf
    reload: true
    state: present
  loop:
    # GPU and CPU share one 128 GB coherent pool, so swapping is not graceful
    # degradation - it is a cliff (reports of 37 -> 1.8 tok/s). Keep swap as an
    # emergency valve only. Stock is 60.
    - { key: vm.swappiness,     value: "1" }
    # Stock is ~45 MB of reserve on a 121 GiB machine, which is far too little
    # headroom to service allocations while reclaiming.
    - { key: vm.min_free_kbytes, value: "1048576" }
    # Socket buffer ceilings for large TCP transfers (checkpoint copies, model
    # downloads). NOT for NCCL - that runs over RDMA and bypasses the socket
    # layer entirely. Deliberately only the ceilings: overriding tcp_rmem /
    # tcp_wmem autotuning works against DGX's fq_codel bufferbloat defaults.
    - { key: net.core.rmem_max, value: "134217728" }
    - { key: net.core.wmem_max, value: "134217728" }
    - { key: fs.inotify.max_user_watches, value: "524288" }
  become: true

# memlock is the one limit that genuinely matters here: RDMA pins pages for the
# ConnectX-7, and CUDA pins host buffers. Scoped to the primary user rather
# than `*` - on a box where 121 GB is shared coherently with the GPU, letting
# every account pin without bound is how you get an unrecoverable machine.
#
# NOT set here: nofile (DGX's nv-limits.conf sets 500000 deliberately and sorts
# after this file alphabetically, so it wins anyway) and stack (unlimited
# switches the kernel to the legacy mmap layout, weakening ASLR, and makes
# glibc size pthread stacks at 32 MB instead of 8 MB).
- name: Raise memlock for the primary user
  ansible.builtin.copy:
    dest: /etc/security/limits.d/90-gx10.conf
    mode: "0644"
    content: |
      # Managed by gx10-cluster ansible. Do not edit by hand.
      {{ primary_user }}    soft    memlock     {{ memlock_limit_kb }}
      {{ primary_user }}    hard    memlock     {{ memlock_limit_kb }}
  become: true

- name: Check for a pending reboot
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required

- name: Warn on pending reboot
  ansible.builtin.debug:
    msg: >-
      A reboot is pending on {{ ansible_facts['hostname'] }} (kernel or driver update).
      Reboot before trusting any CUDA result from this run.
  when: reboot_required.stat.exists
