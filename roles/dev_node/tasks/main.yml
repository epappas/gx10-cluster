---
# Node via nvm rather than apt or NodeSource: it keeps node in userland (no
# sudo for global installs) and NodeSource's arm64 builds lag on this platform.

- name: Install nvm
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/{{ nvm_version }}/install.sh
      | bash
    executable: /bin/bash
    creates: "{{ primary_home }}/.nvm/nvm.sh"
  become_user: "{{ primary_user }}"
  become: true

- name: Install Node.js {{ node_version }}
  ansible.builtin.shell:
    cmd: |
      set -e
      . "$HOME/.nvm/nvm.sh"
      nvm install {{ node_version }}
      nvm alias default {{ node_version }}
    executable: /bin/bash
    creates: "{{ primary_home }}/.nvm/alias/default"
  become_user: "{{ primary_user }}"
  become: true

- name: Install global npm packages
  ansible.builtin.shell:
    cmd: |
      set -e
      . "$HOME/.nvm/nvm.sh"
      nvm use default >/dev/null
      npm install -g {{ npm_globals | join(' ') }}
    executable: /bin/bash
  become_user: "{{ primary_user }}"
  become: true
  register: npm_global
  # npm prints "changed 0 packages" on a no-op, so testing for the substring
  # "changed" matches every run. Count the actual number instead.
  changed_when: >-
    npm_global.stdout is search('added \d+ package')
    or npm_global.stdout is search('changed [1-9]\d* package')
