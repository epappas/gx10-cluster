---
# Read-only health check. Genuinely read-only: no image pulls, no sudo.
#
#   ansible-playbook verify.yml

- name: Verify GX10 node
  hosts: gx10
  gather_facts: true

  tasks:
    - name: Collect checks
      ansible.builtin.shell:
        cmd: "{{ item.cmd }}"
        executable: /bin/bash
      loop:
        - name: "GPU"
          cmd: "nvidia-smi --query-gpu=name,driver_version,compute_cap --format=csv,noheader"
        - name: "CUDA toolkit"
          cmd: "nvcc --version | tail -1"
        - name: "docker (no sudo)"
          cmd: "docker info --format '{{ '{{' }}.ServerVersion{{ '}}' }} runtime={{ '{{' }}.DefaultRuntime{{ '}}' }}'"
        - name: "NCCL"
          cmd: "dpkg -l libnccl2 | awk '/^ii/{print $3}'"
        - name: "torch"
          cmd: >-
            {{ ml_venv }}/bin/python -c "import torch;
            print(torch.__version__, torch.cuda.get_device_name(0),
            'sm_'+''.join(map(str, torch.cuda.get_device_capability(0))),
            'nccl' if torch.distributed.is_nccl_available() else 'NO-NCCL')"
        - name: "torch matmul"
          cmd: >-
            {{ ml_venv }}/bin/python -c "import torch;
            x=torch.randn(4096, 4096, device='cuda');
            torch.cuda.synchronize(); print('ok')"
        - name: "rust"
          cmd: "$HOME/.cargo/bin/rustc --version"
        - name: "node"
          cmd: "source $HOME/.nvm/nvm.sh && node --version"
        - name: "uv"
          cmd: "{{ uv_bin }} --version"
        - name: "ollama"
          cmd: "systemctl is-active ollama"
        - name: "llama.cpp"
          cmd: "$HOME/.local/bin/llama-cli --version 2>&1 | head -1"
        - name: "sshd"
          cmd: "systemctl is-active ssh.socket"
        # systemctl, not `sudo ufw status` - the latter needs a password and
        # would just print a permanent red line in a health check.
        - name: "ufw"
          cmd: "systemctl is-active ufw"
        - name: "swappiness"
          cmd: "sysctl -n vm.swappiness"
        - name: "memlock"
          cmd: "ulimit -l"
        - name: "RDMA devices"
          cmd: "ibv_devices 2>/dev/null | tail -n +3 | grep -c . || echo 0"
        - name: "interconnect"
          cmd: >-
            ip -br addr show | grep -E '{{ cluster_subnets | join("|") | replace(".", "\\.") }}'
            || echo 'not configured (cable not connected?)'
      register: checks
      changed_when: false
      failed_when: false

    - name: Report
      ansible.builtin.debug:
        msg: "{{ '%-16s' | format(item.item.name) }} {{ (item.stdout | default('') or item.stderr | default('') or 'FAILED') | trim | truncate(110) }}"
      loop: "{{ checks.results }}"
      loop_control:
        label: "{{ item.item.name }}"
