---
# Health check that FAILS when something is wrong.
#
# The previous version printed a table and always exited 0, which meant a
# broken node looked identical to a healthy one. Every check here is an
# assertion; `make verify` returns non-zero if the node is not in the state
# this repo claims it is.
#
# Read-only: no image pulls, no sudo, no changes.

- name: Verify GX10 node
  hosts: gx10
  gather_facts: true

  # Explicit vars_files, not group_vars/: this list belongs to this playbook,
  # and a group_vars file would have to be named after a real inventory group.
  vars_files:
    - vars/verify_checks.yml

  tasks:
    - name: Read node state
      ansible.builtin.shell:
        cmd: "{{ item.cmd }}"
        executable: /bin/bash
      loop: "{{ verify_checks }}"
      loop_control:
        label: "{{ item.name }}"
      register: checks
      changed_when: false
      failed_when: false

    - name: Report
      ansible.builtin.debug:
        msg: >-
          {{ '%-18s' | format(item.item.name) }}
          {{ '   ok' if item.rc == 0 else 'FAILED' }}
          {{ (item.stdout | default('') or item.stderr | default('')) | trim | truncate(90) }}
      loop: "{{ checks.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Assert every required check passed
      ansible.builtin.assert:
        that: item.rc == 0
        fail_msg: >-
          {{ item.item.name }} FAILED (rc={{ item.rc }}):
          {{ (item.stdout | default('') or item.stderr | default('')) | trim }}
          -- {{ item.item.hint | default('(no hint recorded)') }}
      loop: "{{ checks.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: item.item.required | default(true)

    - name: Report optional checks that did not pass
      ansible.builtin.debug:
        msg: "{{ item.item.name }}: {{ item.item.hint | default('(no hint recorded)') }}"
      loop: "{{ checks.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when:
        - not (item.item.required | default(true))
        - item.rc != 0
