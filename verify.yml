---
# Health check that FAILS when something is wrong.
#
# The previous version printed a table and always exited 0, which meant a
# broken node looked identical to a healthy one. Every check here is an
# assertion; `make verify` returns non-zero if the node is not in the state
# this repo claims it is.
#
# Two layers: the per-node checks in vars/verify_checks.yml, then a cross-node
# block at the end for the things only visible with both hosts in the play.
#
# Read-only: no image pulls, no sudo, no changes.

- name: Verify GX10 node
  hosts: gx10
  gather_facts: true

  # Explicit vars_files, not group_vars/: this list belongs to this playbook,
  # and a group_vars file would have to be named after a real inventory group.
  vars_files:
    - vars/verify_checks.yml

  vars:
    # Every host that got as far as recording its versions. Deliberately
    # ansible_play_hosts_ALL: a host that fails an assertion is dropped from
    # ansible_play_hosts, and drift is precisely what you want reported when
    # something else on that node is already broken.
    version_hosts: >-
      {{ ansible_play_hosts_all | map('extract', hostvars)
         | selectattr('gx10_versions', 'defined')
         | map(attribute='inventory_hostname') | list }}

    # The subset that shares a collective: interconnect members, the hosts a
    # cluster_index is defined for (see inventory.yml). Driver and kernel are
    # only compared among these, because the failure this assert guards -
    # ranks that disagree abort or hang at NCCL init reading like a fabric
    # problem - structurally needs the fabric. A mesh-only GB10 on a newer
    # factory DGX OS shares no collective with the pair, so its 580.178 image
    # is reported per-node rather than failing the run; its TORCH is still
    # compared across every node, because the same lockfile on every box is
    # what makes the boxes interchangeable at all, cable or no cable.
    fabric_version_hosts: >-
      {{ version_hosts | map('extract', hostvars)
         | selectattr('cluster_index', 'defined')
         | map(attribute='inventory_hostname') | list }}

  tasks:
    - name: Read node state
      ansible.builtin.shell:
        cmd: "{{ item.cmd }}"
        executable: /bin/bash
      loop: "{{ verify_checks }}"
      loop_control:
        label: "{{ item.name }}"
      register: checks
      changed_when: false
      failed_when: false

    # Collected BEFORE the asserts below, so a node that fails one of them has
    # still published its versions for the cross-node comparison at the end.
    - name: Read the versions that must match across nodes
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          printf '{"driver": "%s", "kernel": "%s", "torch": "%s"}'
          "$(nvidia-smi --query-gpu=driver_version --format=csv,noheader 2>/dev/null | head -1)"
          "$(uname -r)"
          "$({{ ml_venv }}/bin/python -c 'import torch; print(torch.__version__)' 2>/dev/null)"
        executable: /bin/bash
      register: node_versions
      changed_when: false

    - name: Record this node's versions
      ansible.builtin.set_fact:
        gx10_versions: "{{ node_versions.stdout | from_json }}"

    - name: Report
      ansible.builtin.debug:
        msg: >-
          {{ '%-18s' | format(item.item.name) }}
          {{ '   ok' if item.rc == 0 else 'FAILED' }}
          {{ (item.stdout | default('') or item.stderr | default('')) | trim | truncate(90) }}
      loop: "{{ checks.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Assert every required check passed
      ansible.builtin.assert:
        that: item.rc == 0
        fail_msg: >-
          {{ item.item.name }} FAILED (rc={{ item.rc }}):
          {{ (item.stdout | default('') or item.stderr | default('')) | trim }}
          -- {{ item.item.hint | default('(no hint recorded)') }}
      loop: "{{ checks.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: item.item.required | default(true)

    - name: Report optional checks that did not pass
      ansible.builtin.debug:
        msg: "{{ item.item.name }}: {{ item.item.hint | default('(no hint recorded)') }}"
      loop: "{{ checks.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when:
        - not (item.item.required | default(true))
        - item.rc != 0

    # --- Cross-node ----------------------------------------------------------
    # Every check above validates one node in isolation, which misses the
    # failure this cluster is most likely to have: the two boxes disagreeing on
    # driver, kernel or torch version. NCCL then aborts or hangs at init with an
    # error that reads like a fabric problem, while both nodes verify clean.
    #
    # This cannot be a verify_checks entry - those are shell commands run on one
    # host, and nothing in a shell on node A can see node B's state.
    #
    # The comparison tasks below each look at every host at once, so they need
    # to run on ONE of them. `inventory_hostname == ansible_play_hosts | first` rather than
    # run_once: identical under the default linear strategy, and it does not
    # trip run-once[task], whose warning about `strategy: free` is real - under
    # it a host can reach this before the other has recorded anything.
    - name: Note when drift could not be checked
      ansible.builtin.debug:
        msg: >-
          Only {{ version_hosts | join(', ') }} took part in this run, so
          cross-node version drift was NOT checked. This node has
          {{ gx10_versions }}. Run `make verify` with no --limit before
          trusting a distributed job.
      when:
        - inventory_hostname == ansible_play_hosts | first
        - version_hosts | length < 2

    - name: Assert the fabric nodes agree on driver and kernel version
      ansible.builtin.assert:
        that: >-
          fabric_version_hosts | map('extract', hostvars, ['gx10_versions', item.key])
          | unique | length == 1
        fail_msg: >-
          {{ item.key }} differs across the interconnect nodes:
          {% for h in fabric_version_hosts %}{{ h }}={{ hostvars[h].gx10_versions[item.key] | default('(none)', true) }} {% endfor %}
          -- ranks that disagree fail in ways that look like a fabric problem. {{ item.hint }}
      loop:
        - { key: driver, hint: "See docs/runbooks/upgrade-drivers.md" }
        - { key: kernel, hint: "See docs/runbooks/upgrade-drivers.md" }
      loop_control:
        label: "{{ item.key }}"
      when:
        - inventory_hostname == ansible_play_hosts | first
        - fabric_version_hosts | length > 1

    # torch across EVERY node, not just the fabric - see the
    # fabric_version_hosts comment for why driver/kernel do not.
    - name: Assert every node agrees on the torch version
      ansible.builtin.assert:
        that: >-
          version_hosts | map('extract', hostvars, ['gx10_versions', item.key])
          | unique | length == 1
        fail_msg: >-
          {{ item.key }} differs across nodes:
          {% for h in version_hosts %}{{ h }}={{ hostvars[h].gx10_versions[item.key] | default('(none)', true) }} {% endfor %}
          -- two boxes on one lockfile is the whole claim. {{ item.hint }}
      loop:
        - { key: torch,  hint: "Re-run: make apply TAGS=ml. See docs/runbooks/troubleshoot.md" }
      loop_control:
        label: "{{ item.key }}"
      when:
        - inventory_hostname == ansible_play_hosts | first
        - version_hosts | length > 1
