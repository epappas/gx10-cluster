name: vllm-2node-glm53-flash-exl3
kind: inference
engine: vllm
provenance: verified
summary: GLM-5.3-Flash EXL3 4bpw across both nodes - 66.4 tok/s, 0.962 acceptance, 128K context

# VERIFIED on odysseus + poseidon, and the hard part - the overlay image, the
# mandatory kpool patch, the DFlash2 drafter - all works:
#
#   block_table.py: kpool tail slot-map patched     <- the correctness fix
#   NET/IB ... RoCE ... speed=200000                <- both rails
#   GPU KV cache size: 602,033 tokens
#   ws up spec-decode-accept   1.00 0.99 0.99 0.97 0.97 0.92 0.88  (k=7)
#                              structured 0.962, 6.74 of 8 accepted per step,
#                              66.4 tok/s median, TTFT 0.48s
#                              prose 0.324, 2.27/step, 26.2 tok/s, TTFT 0.64s
#                              (published figures are 0.92 / 0.33)
#   concurrency sweep          24.1 / 39.9 / 53.7 tok/s at 1 / 4 / 16 streams
#   ws up vllm-quality-gate    16/18 - both failures are "hit max_tokens=1024,
#                              too short to classify", not correctness
#   GPU KV cache size          136,212 tokens
#
# THE FIRST SET OF NUMBERS HERE WAS NOT EVIDENCE, and that is worth recording.
# It read "aggregate 0.985, 67.4 tok/s" from a run whose output went to a
# terminal and was never written to a file. The re-measurement above is close
# to it - so the old figure was not wrong - but "close to a number nobody can
# open" is not the standard this repo holds itself to. Numbers here now come
# with a log.
#
# AND THE FIRST BENCH RUN WAS INVALID, which the tool said out loud:
#   odysseus ... mem 97%  swap +2205 MB SINCE START - NOT A VALID RESULT
# vllm-bench-serve never completed a point. Swap growth is the disqualifying
# condition, so the answer was headroom rather than a retry.
#
# THREE THINGS THIS BOX NEEDED THAT THE PUBLISHED RECIPE DOES NOT SAY.
#
# 1. MODEL MUST BE A PATH, NOT A REPO ID. The overlay's multimodal loader joins
#    the model string with a filename instead of resolving through the Hub:
#      FileNotFoundError: 'Mia-AiLab/GLM-5.3-Flash-EXL3-TR3-4bpw/processor_config.json'
#    The file is present both locally and on the Hub - it is the lookup that is
#    wrong. Point MODEL at the snapshot directory as the container sees it:
#      MODEL=/hf/hub/models--Mia-AiLab--GLM-5.3-Flash-EXL3-TR3-4bpw/snapshots/<sha>
#    Both nodes resolved the same snapshot sha, which is what makes this safe.
#
# 2. 0.87 DOES NOT FIT HERE - by 0.95 GiB, exactly as the note below predicts:
#      Free memory on device cuda:0 (104.87/121.63 GiB) is less than desired
#      GPU memory utilization (0.87, 105.82 GiB)
#    The documented fallback (0.86) is right and was not enough on its own.
#
# 3. AND 800000 STILL DID NOT FIT at 0.86: 16.44 GiB of KV needed against
#    14.25 GiB available. 600000 does, with 602,033 pool tokens. So the
#    published 1M figure is a property of the reference kit's headroom, not of
#    the model - see the arithmetic above, which stays correct.
#
# ONE OPEN NUMBER: prefix-cache reuse measured 0.50 efficiency (3584 of 7168
# allowed) rather than the ~1.0 the README's hybrid-page argument predicts.
# Not chased. It is a throughput question, not a correctness one, and the
# ladder reports it honestly rather than rounding it up.

# THE ARITHMETIC, because it is the whole design:
#
#   EXL3/TR3 4bpw checkpoint   ~164 GiB  (120 shards)
#   split TP=2                  ~82 GiB of weights per node
#   claimable at 0.87          ~105 GiB per node (of 121 GiB unified)
#   left for KV                 ~19 GiB per node
#
# That last line is the smallest KV budget of any workspace here, and 1M
# context still allocates on it - which looks impossible and is not. The target
# KV is packed `fp8_ds_mla` at 656 B/token/layer over TWELVE MLA layers, and the
# other 33 layers are mamba, whose state is mostly length-INDEPENDENT. A hybrid
# model's pool is a large fixed floor plus a small per-token slope, so the cap
# you ask for is much cheaper here than the same number on a dense model.
#
# This is also why `MAX_MODEL_LEN=256000` does not "free" KV and is the first
# wrong move people make - see .env.example.
#
# WHY THIS IS NOT vllm-2node-tp2 WITH DIFFERENT FLAGS: it is, plus one thing
# that workspace cannot express. The EXL3 quantisation method, the NoPE-MLA
# padding into the SM120 sparse-MLA geometry and the DFlash2 drafter do not
# exist in upstream vLLM; they come from an overlay image. One of that overlay's
# patches is shipped-but-not-applied in the image and has to run INSIDE the
# container before `vllm serve`, which is what PRE_EXEC in the shared launcher
# is for (docs/decisions.md#glm53-flash).
#
# `ws check` can only measure THIS node. The peer needs the same ~106 GiB free
# and its own copy of the weights - run `ws check` on both, and see
# ./stage-weights.sh for getting 164 GiB there without a second Hub download.
requires:
  gpu_arch: "12.1"
  # The tightest memory requirement in this repo, and it is not padding: the
  # published recipe reports kits missing 0.87 by well under 1 GiB because a
  # desktop session or a dashboard was resident. If this fails by a hair,
  # GPU_MEM_UTIL=0.86 with MAX_MODEL_LEN=800000 is the documented fallback.
  min_unified_gb: 106
  # ~164 GiB of weights plus a ~2.3 GiB drafter, on the same 1 TB NVMe as
  # everything else, and they must land on BOTH nodes.
  min_disk_gb: 180
  docker: true
  rdma: true
  peers: 1

images:
  - ghcr.io/miaai-lab/glm-5.3-flash-2x-dgx-sparks:exl3

models:
  - Mia-AiLab/GLM-5.3-Flash-EXL3-TR3-4bpw
  - incoai/GLM-5.3-Flash-DFlash2

# The container `ws logs` tails. Named here rather than parsed out of up.sh:
# these workspaces run `docker run` directly, so there is no compose project
# for `ws logs` to ask.
# Rank 0, here. Rank 1 is the same name on the peer.
container: ws-vllm-glm53-exl3

endpoints:
  - "http://127.0.0.1:8893/v1  (OpenAI-compatible, on the rank-0 node)"

sources:
  - https://github.com/MiaAI-Lab/GLM-5.3-Flash-EXL3-2x-DGX-Sparks
  - https://huggingface.co/Mia-AiLab/GLM-5.3-Flash-EXL3-TR3-4bpw
  - https://huggingface.co/brandonmusic/GLM-5.3-Flash-tr3-4bpw
  - https://huggingface.co/incoai/GLM-5.3-Flash-DFlash2
  - https://huggingface.co/zai-org/GLM-5.3-Flash
  - https://github.com/turboderp-org/exllamav3
