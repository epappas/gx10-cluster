# SGLang serving the GGUF build. See workspace.yml for why this is not NVFP4.
#
# No aarch64 tag is published as reliably as vLLM's, so this pins :latest and
# the manifest marks the workspace unverified. If the image does not exist for
# arm64 on your day, that is the first thing to check - `ws check` reports the
# image as not-pulled, which looks identical to "not yet downloaded".
services:
  sglang:
    image: ${SGLANG_IMAGE:-lmsysorg/sglang:latest}
    container_name: ws-sglang-qwen38-gguf
    restart: unless-stopped
    runtime: nvidia
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HOME=/hf
    volumes:
      - ${HF_HOME:-${HOME}/.cache/huggingface}:/hf
    ports:
      - "${PORT:-8900}:30000"
    shm_size: ${SHM_SIZE:-16g}
    ipc: host
    command: >
      python3 -m sglang.launch_server
      --model-path ${MODEL:-unsloth/Qwen3.8-27B-GGUF}
      --host 0.0.0.0 --port 30000
      --context-length ${CTX:-262144}
      --mem-fraction-static ${MEM_FRACTION:-0.80}
      --trust-remote-code
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:30000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: ${START_PERIOD:-15m}
