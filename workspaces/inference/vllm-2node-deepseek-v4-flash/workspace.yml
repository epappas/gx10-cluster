name: vllm-2node-deepseek-v4-flash
kind: inference
engine: vllm
provenance: verified
summary: DeepSeek-V4-Flash (284B/13B) across both nodes - 80.0 tok/s, 0.994 DSpark acceptance

# VERIFIED on odysseus + poseidon. ~149 GiB of FP8 sharded TP=2 over RoCE,
# 7m20s to /health, 131072 context, 10.22 GiB of KV per node, and DSpark doing
# exactly what the header above claims:
#
#   ws up spec-decode-accept   structured  1.00 1.00 1.00 0.99 0.99  (k=5)
#                              0.994 acceptance, 4.97 of 6 accepted per step
#                              80.0 tok/s decode, TTFT 0.35s
#                              prose 0.496, 2.48/step, 46.3 tok/s
#   concurrency sweep          34.1 / 51.1 / 73.3 tok/s at 1 / 4 / 16 streams
#   ws up vllm-quality-gate    14/18 - the four failures are "reasoning never
#                              closed" at max_tokens=1024, not correctness
#   ws up vllm-prefill-ladder  709-779 tok/s cold; the follow-up turn reused
#                              7680 tokens and went 11.18 s -> 0.47 s TTFT
#   GPU KV cache size          157,271 tokens
#   swap                       4 GiB / 3 GiB, UNCHANGED across all three probes
#
# RE-RUN FROM A GENUINELY COLD START - weights deleted from both nodes, no
# .env, one `ws up`, nothing staged by hand. 0 restarts, healthy ~57 min later,
# of which 2775s was the two ranks downloading in parallel. The earlier numbers
# here (79.9 tok/s, acceptance 1.00) came back as 80.0 and 0.994, so they were
# right - they just had no log behind them, and now they do.
#
# COLD-START COST: both ranks fetch their OWN copy, so 156 GiB crosses the WAN
# twice and each rank sees ~56 MB/s. vllm-2node-glm53-flash-exl3 downloads once
# at ~110 MB/s and moves the second copy over the interconnect at 534 MB/s.
# Doing the same here would roughly halve the cold start.
#
# ONE FLAG HAD TO COME OFF, and it is the one every official launch line for
# this model carries. `--attention-config '{"use_fp4_indexer_cache": true}'`
# crash-loops the worker here:
#
#   ValueError: indexer_kv_dtype='mxfp4' requires Blackwell datacenter GPUs
#   (sm_10x, e.g. B200/GB200); sm_120 (consumer Blackwell) and earlier
#   architectures are not supported.
#
# The recipes this was ported from run on GB200/B200; GB10 is sm_121. It is now
# opt-in through ATTENTION_CONFIG, off by default, with the reasoning in up.sh.
# `--restart unless-stopped` turned that into 20 restarts in nine minutes, each
# logging the line above - loud rather than silent, which is how it was found.
#
# ALSO WORTH KNOWING: weights have to land on BOTH nodes, and
# ../vllm-2node-glm53-flash-exl3/stage-weights.sh's mechanism does it over the
# cable at 487 MB/s measured - 170 GB in about six minutes, against hours of
# WAN for a second Hub download.

# THE ARITHMETIC, because it is the whole design:
#
#   FP8 checkpoint            ~149 GiB
#   split TP=2                 ~75 GiB of weights per node
#   claimable at 0.80          ~97 GiB per node (of 121 GiB unified)
#   left for KV                ~22 GiB per node
#
# Every non-obvious default in up.sh falls out of that last line. --max-num-seqs
# is 6, not 256. --max-model-len is 128K, not the 1M the model supports. Both
# look timid and both are the honest numbers for 22 GiB of KV.
#
# 1M context is real, but it rests on `nvfp4_ds_mla` - a KV dtype with a
# 584-byte sparse-MLA envelope per token, from the fork lineage rather than
# upstream. See .env.example for how to switch to it, and what you take on.
#
# WHY THIS EXISTS ALONGSIDE vllm-2node-tp2: that one is the GENERIC two-node
# recipe and deliberately refused everything DeepSeek-specific
# (docs/decisions.md#two-node-vllm). This is where that refused half lives.
# They share the launcher (workspaces/lib/twonode.sh) and nothing else.
#
# `ws check` can only measure THIS node. The peer needs the same ~100 GiB free
# and nothing here can confirm that - run `ws check` on both, or `gx10-top`.
requires:
  gpu_arch: "12.1"
  min_unified_gb: 100
  # ~149 GiB of weights have to land somewhere before they can be loaded, and
  # the HF cache is on the same 1 TB NVMe as everything else.
  min_disk_gb: 170
  docker: true
  rdma: true
  peers: 1

images:
  - vllm/vllm-openai:nightly-aarch64

models:
  - deepseek-ai/DeepSeek-V4-Flash-DSpark

# The container `ws logs` tails. Named here rather than parsed out of up.sh:
# these workspaces run `docker run` directly, so there is no compose project
# for `ws logs` to ask.
# Rank 0, here. Rank 1 is the same name on the peer.
container: ws-vllm-ds-v4-flash

endpoints:
  - "http://127.0.0.1:8890/v1  (OpenAI-compatible, on the rank-0 node)"

sources:
  - https://huggingface.co/deepseek-ai/DeepSeek-V4-Flash-DSpark
  - https://huggingface.co/deepseek-ai/DeepSeek-V4-Flash-0731
  - https://recipes.vllm.ai/deepseek-ai/DeepSeek-V4-Flash
  - https://github.com/MiaAI-Lab/DeepSeek-v4-Flash-DSpark-2x-DGX-Spark
  - https://github.com/tonyd2wild/DeepSeek-v4-Flash-0731-DSpark-1M-NVFP4-KV-2x-DGX-Spark
