name: tensorfold-2node-dsv41-flash-1017
kind: inference
engine: tensorfold
provenance: unverified
summary: DeepSeek-V4.1-Flash-1017 EXL3 2.9bpw on the pair (TensorFold Zig engine) - upstream's current path; disk cleared 2026-10-20 (541/430 GB free), bootable once the pair server comes down

# WHAT THIS IS: MiaAI-Lab's DeepSeek-V4.1-Flash-1017 kit (Apache-2.0, created
# 2026-10-19) at a pinned commit - TensorFold's native Zig engine, BertholomusAI's
# `dsv41` family at TP=2, one rank per Spark. It supersedes
# ../vllm-2node-dsv41-flash-exl3 on every axis upstream:
#
#   - engine: Zig tensorfold-native + tf-dsv41-lanes (image tag hashes off the
#     kit tree and is not reliably published - it BUILDS locally in ~5 min),
#     interleave-ON and image-prompt-cache patches measured on the pair (120k
#     cold prompt: a decoding stream's longest token gap 90 s -> 1.3 s), plus
#     at re-pin time: RDMA idle-nap, shared-pool>window, both-rank pool/window
#     consistency (370daf0)
#   - checkpoint: Mia-AiLab/DeepSeek-V4.1-Flash-1017-EXL3-EAQ-v1-2.9-bpw @
#     45ee5d0f (HEAD verified 2026-10-20). This repo REWROTE ITS HISTORY the
#     day it was born - a "super-squash" erased the 6d54be4f the kit pinned an
#     hour earlier, and the download failed "Revision not found" until the kit
#     re-pinned. e8ac7684 (vLLM-port era) is gone too. A cache copy under any
#     older revision is not this checkpoint.
#   - quality receipt (model card, same-day): teacher-forced KL vs the
#     original weights - agentic 0.0068 nats (98.0% top-1), code 0.0074
#     (98.2%), tool-calling 0.0113 (97.3%); weakest chat 0.0357 (94.0%).
#     Teacher-forced, <=32.7k context only; free-generation quality is still
#     what vllm-quality-gate and quant-quality-ab exist to measure HERE.
#   - Engram: from deepseek-ai/DeepSeek-V4.1-Flash-1017 @ 1bae0e10, shards
#     47+48, ~203 GB - NEW tables; the older release's MUST NOT be used
#     (the kit's prepare.sh checks shard sizes exactly)
#   - decode (their pair, sparkDash): prose 74.9 / code 109.9 tok/s single
#     stream; 130.0 / 155.5 at 4; prefill ~2,100-2,200 tok/s to 128k, 2,000 at
#     256k; 1,048,576 window default, 524,288 practical on a busy head
#
# WAS `blocked` on disk until 2026-10-20, when an operator-approved reclaim
# cleared it: ~505 GB head / ~310 worker demanded; the RL-era artifacts
# (/var/tmp/autoresearch-rl-models on both nodes, ~/experiments, the
# experiment-era Qwen caches, two stale images) freed +199 GB on odysseus
# (now 541 free) and +305 on poseidon (now 430). `ws check` passes every
# disk gate; the only red line left is MemAvailable, which is the live vLLM
# pair's to release - see README for what booting it costs the session it
# serves. README "The disk arithmetic" keeps the original numbers as the
# history of why this sat blocked for seven weeks.

requires:
  gpu_arch: "12.1"
  # ~98-99 GiB of weights a rank; rank 0 holds ~104 GiB on the GPU; the kit
  # refuses to start under MIN_AVAIL_GIB=112 per Spark. That is the floor for
  # THIS machine layout (a head that also runs a desktop was left ~3.1 GiB
  # clear at the worst point of a 100k prompt); CONTEXT=524288 or less.
  min_unified_gb: 112
  # Head: the kit's own number (README Requirements: ~505 GB, image included).
  min_disk_gb: 505
  docker: true
  rdma: true
  peers: 1

images:
  # Built LOCALLY - twice now, because the kit tree moves daily and the tag
  # hashes the patches. First boot (31eea46 tree) built exl3-tp2-8eb5919ff0a4
  # in 275 s, identical on both Sparks; the 370daf0 re-pin adds 4 patches, so
  # the next boot rebuilds against ITS hash. The README's advertised ghcr tag
  # (7c9bf5d36350) matches neither. Treat the image line as the build recipe,
  # not a pull: PULL tries the tree's hash, fails, builds. The base below is
  # the real pull; the result is a local tensorfold-dsv41:<tree-hash> image.
  - nvcr.io/nvidia/pytorch:26.07-py3

models:
  - Mia-AiLab/DeepSeek-V4.1-Flash-1017-EXL3-EAQ-v1-2.9-bpw
  - deepseek-ai/DeepSeek-V4.1-Flash-1017

container: dsv41-1017-exl3-tf

endpoints:
  - "http://127.0.0.1:8903/v1  (OpenAI-compatible, on the head)"

sources:
  - https://github.com/MiaAI-Lab/DeepSeek-v4.1-Flash-1017-2x-DGX-Sparks
  - https://huggingface.co/Mia-AiLab/DeepSeek-V4.1-Flash-1017-EXL3-EAQ-v1-2.9-bpw
  - https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash-1017
  - https://github.com/bertholomus/TensorFold
  - https://github.com/bertholomus/deepseek-v4.1-tensorfold-tp2-2xgb10
