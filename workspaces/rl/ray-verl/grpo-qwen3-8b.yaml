# verl GRPO on a single GB10. Values chosen for MEMORY headroom, not speed.
#
# Every knob below that looks conservative is conservative on purpose: on
# unified memory the trainer, the rollout engine and the OS page cache share
# one pool, so the usual "GPU has 80 GB, use 75" reasoning does not transfer.
# Treat this as a starting point that fits, then raise one number at a time.
#
# UNVERIFIED: written from verl's documented schema, not from a completed run
# on this hardware. Expect to fix at least one key name on first use, and see
# workspaces/README.md for how to report back what you changed.
data:
  train_batch_size: 8
  max_prompt_length: 1024
  max_response_length: 1024

actor_rollout_ref:
  model:
    path: Qwen/Qwen3-8B
    # Gradient checkpointing is not optional here - it is the difference
    # between fitting and not.
    enable_gradient_checkpointing: true
  actor:
    strategy: fsdp
    ppo_mini_batch_size: 4
    ppo_micro_batch_size_per_gpu: 1
    optim:
      lr: 1e-6
    fsdp_config:
      # Offloading to "CPU" on a coherent-memory box does not move bytes across
      # PCIe - there is one pool - but it does let FSDP release its own
      # allocator pressure, which is the thing that OOMs first.
      param_offload: true
      optimizer_offload: true
  rollout:
    name: vllm
    # The rollout engine and the trainer are co-resident. This fraction is of
    # the SAME pool the trainer is using, so it must stay well under what a
    # serving-only workspace would take (0.84 there, 0.35 here).
    gpu_memory_utilization: 0.35
    tensor_model_parallel_size: 1
    n: 4

algorithm:
  adv_estimator: grpo

trainer:
  n_gpus_per_node: 1
  nnodes: 1
  total_epochs: 1
  logger: [console]
