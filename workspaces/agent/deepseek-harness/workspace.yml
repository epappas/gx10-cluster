name: deepseek-harness
kind: agent
engine: dsh
provenance: verified
summary: DeepSeek Harness web UI on gb10-homer, pointed at a model this cluster serves

# VERIFIED on a GB10: `ws up` -> npx resolves the package tree into ./dsh-home
# -> `dsh web: http://127.0.0.1:3080` -> the UI serves 200, with profiles/ and
# storages/ created and owned by the invoking user rather than root. `ws down`
# removes it cleanly.
#
# WHERE IT RUNS NOW. On gb10-homer, not on the head: a client holds no GPU and
# no unified memory, and the head is the node memguard watches. up.sh deploys
# compose.yml/.env/settings.yaml to the node over ssh and starts it there;
# down.sh, logs.sh and ask.sh follow HARNESS_HOST. The server stays on
# odysseus and the harness reaches it over the mesh - see README, "Where the
# harness runs" and "Reaching the server".
#
# ONE NUMBER CHANGED. start_period was 3m and the first start took ~7.5 minutes
# of npm resolution before anything bound the port, so `ws status` reported
# `unhealthy` most of the way through a perfectly good start. Health does not
# drive `restart: unless-stopped`, so nothing was actually looping - it just
# read as broken. 12m now.

# WHAT THIS IS FOR. The inference workspaces give you an OpenAI-compatible
# endpoint; nothing here has ever given you something to USE it with. dsh is
# DeepSeek's own agent harness - plugin-based, MIT, a local web UI - and it
# takes a custom OpenAI-compatible provider, which is exactly what a GB10
# running vLLM is.
#
# So the pairing is the point:
#   ws up vllm-2node-deepseek-v4-flash    # the model, on the cluster
#   ws up deepseek-harness                # the agent, talking to it
# and no token leaves the house.
#
# `kind: agent`, not `inference`, and the distinction is not bookkeeping: this
# runs no model, claims no GPU, and needs no unified memory. It coexists with a
# serving workspace, which no two inference workspaces do.
#
# TWO HONEST WARNINGS.
# 1. It is a DEVELOPER PREVIEW by its own README, with compatibility changes
#    ongoing. `latest` is unpinned here deliberately; see compose.yml.
# 2. It is an AGENT HARNESS. It executes tool calls against whatever you mount
#    at /work, on host networking. The default mount is ./work - a directory
#    that starts empty - rather than $HOME, and that default is the security
#    design, not an inconvenience to route around.
requires:
  docker: true

images:
  - node:22-slim

endpoints:
  - "http://127.0.0.1:39090 on gb10-homer  (web UI; ssh -L 39090:127.0.0.1:39090 gb10-homer; DSH_PORT)"

sources:
  - https://github.com/deepseek-ai/deepseek-harness
  - https://deepseek-harness.github.io/deepseek-harness/en/guide/providers
